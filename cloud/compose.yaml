name: ao-cloud-local

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ao_cloud
      POSTGRES_USER: ao_cloud_bootstrap
      POSTGRES_PASSWORD: ao_cloud_local_bootstrap
    ports:
      - "127.0.0.1:${AO_CLOUD_POSTGRES_PORT:-54329}:5432"
    volumes:
      - "${AO_CLOUD_LOCAL_POSTGRES_DATA_DIR:-${AO_DATA_DIR:-${HOME}/.ao}/cloud/postgres}:/var/lib/postgresql/data"
      - ./dev/postgres/init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao_cloud_owner -d ao_cloud"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # S3-compatible store for cloud session artifacts (AO_CLOUD_ARTIFACTS=1).
  # It runs as the invoking user (set by cloud-local-up.sh), who owns the data
  # directory; on Linux the image's own user cannot write a root-owned bind.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    user: "${AO_CLOUD_LOCAL_UID:-65532}:${AO_CLOUD_LOCAL_GID:-65532}"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ao_cloud_local_minio
      MINIO_ROOT_PASSWORD: ao_cloud_local_minio_secret
    volumes:
      - "${AO_CLOUD_LOCAL_MINIO_DATA_DIR:-${AO_DATA_DIR:-${HOME}/.ao}/cloud/minio}:/data"
    restart: unless-stopped

  # Creates the artifact bucket with versioning on, then exits. It gives up
  # after a minute so a MinIO that cannot start fails the bring-up.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:3b5eb8505b378708e08491bd2b487cb39621cabd0cf99bd90927ae83b7378c9b
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        tries=0;
        until mc alias set local http://minio:9000 ao_cloud_local_minio ao_cloud_local_minio_secret;
        do tries=$$((tries + 1)); [ "$$tries" -ge 60 ] && exit 1; sleep 1; done &&
        mc mb --ignore-existing local/ao-cloud-local-tenant-artifacts &&
        mc version enable local/ao-cloud-local-tenant-artifacts
    depends_on:
      - minio
    restart: "no"

  migrate:
    build:
      context: .
      target: control-plane
    entrypoint: ["/ao-cloud-migrate"]
    environment:
      AO_CLOUD_MIGRATION_DATABASE_URL: postgres://ao_cloud_owner:ao_cloud_local_owner@postgres:5432/ao_cloud?sslmode=disable
      AO_CLOUD_RUNTIME_DATABASE_USER: ao_cloud_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane:
    build:
      context: .
      target: control-plane
    environment:
      AO_CLOUD_ENV: development
      AO_CLOUD_DEVELOPMENT_SKIP_CREDENTIAL_VALIDATION: "${AO_CLOUD_DEVELOPMENT_SKIP_CREDENTIAL_VALIDATION:-false}"
      AO_CLOUD_GITHUB_LOCAL_TEST: "${AO_CLOUD_GITHUB_LOCAL_TEST:-false}"
      AO_CLOUD_RELEASE: local-compose
      AO_CLOUD_HTTP_ADDRESS: :8080
      AO_CLOUD_DATABASE_URL: postgres://ao_cloud_app:ao_cloud_local_app@postgres:5432/ao_cloud?sslmode=disable
      AO_CLOUD_MIGRATE_ON_STARTUP: "false"
      AO_CLOUD_LOCAL_AUTH: "true"
      AO_CLOUD_LOCAL_SESSION_TTL: 720h
      AO_CLOUD_SANDBOX_PROVIDER: docker
      # The worker tunnel and browser relay are the default local terminal
      # transport. Callers may still set either value explicitly when testing
      # the durable-only path.
      AO_CLOUD_TERMINAL_STREAM: "${AO_CLOUD_TERMINAL_STREAM:-1}"
      AO_CLOUD_TERMINAL_RELAY: "${AO_CLOUD_TERMINAL_RELAY:-1}"
      # Cloud session artifacts, off by default. The bucket lives in the local
      # MinIO service, which the control plane reaches with these credentials.
      AO_CLOUD_ARTIFACTS: "${AO_CLOUD_ARTIFACTS:-0}"
      AO_CLOUD_ARTIFACT_BUCKET: ao-cloud-local-tenant-artifacts
      AO_CLOUD_ARTIFACT_REGION: us-east-1
      AO_CLOUD_ARTIFACT_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ao_cloud_local_minio
      AWS_SECRET_ACCESS_KEY: ao_cloud_local_minio_secret
      # Public links to single files published from local sessions, off by
      # default and development-only. They need AO_CLOUD_ARTIFACTS=1. A link
      # is http://<slug>.share.localhost:<port>/, which resolves to loopback.
      AO_CLOUD_ARTIFACT_SHARES: "${AO_CLOUD_ARTIFACT_SHARES:-0}"
      AO_CLOUD_ARTIFACT_SHARE_ORIGIN: "${AO_CLOUD_ARTIFACT_SHARE_ORIGIN:-http://share.localhost:${AO_CLOUD_PORT:-8081}}"
      AO_CLOUD_ARTIFACT_SHARE_LIMIT: "${AO_CLOUD_ARTIFACT_SHARE_LIMIT:-3}"
      AO_CLOUD_PROVIDER_SECRET_KEY: "${AO_CLOUD_PROVIDER_SECRET_KEY:?AO_CLOUD_PROVIDER_SECRET_KEY is required}"
      AO_CLOUD_PUBLIC_URL: "${AO_CLOUD_PUBLIC_URL:-http://control-plane:8080}"
      AO_CLOUD_WORKER_SIGNING_KEY: "${AO_CLOUD_WORKER_SIGNING_KEY:?AO_CLOUD_WORKER_SIGNING_KEY is required}"
      AO_CLOUD_DOCKER_HOST: unix:///var/run/docker.sock
      AO_CLOUD_DOCKER_WORKER_IMAGE: "${AO_CLOUD_DOCKER_WORKER_IMAGE:-ao-cloud-worker:local}"
      AO_CLOUD_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME:-ao-cloud-local}_default"
      AO_CLOUD_DOCKER_NAMESPACE: "${COMPOSE_PROJECT_NAME:-ao-cloud-local}"
      AO_CLOUD_DOCKER_WORKER_TOKEN_TTL: 15m
      AO_CLOUD_REPOSITORY_BROKER_URL: "${AO_CLOUD_REPOSITORY_BROKER_URL:-}"
      AO_CLOUD_REPOSITORY_BROKER_TOKEN: "${AO_CLOUD_REPOSITORY_BROKER_TOKEN:-}"
      AO_CLOUD_ENV_CONTROL_TOKEN: "${AO_CLOUD_ENV_CONTROL_TOKEN:-}"
      AO_CLOUD_GITHUB_APP_ID: "${AO_CLOUD_GITHUB_APP_ID:-}"
      AO_CLOUD_GITHUB_APP_SLUG: "${AO_CLOUD_GITHUB_APP_SLUG:-}"
      AO_CLOUD_GITHUB_CLIENT_ID: "${AO_CLOUD_GITHUB_CLIENT_ID:-}"
      AO_CLOUD_GITHUB_CLIENT_SECRET: "${AO_CLOUD_GITHUB_CLIENT_SECRET:-}"
      AO_CLOUD_GITHUB_PRIVATE_KEY: "${AO_CLOUD_GITHUB_PRIVATE_KEY:-}"
      AO_CLOUD_GITHUB_WEBHOOK_SECRET: "${AO_CLOUD_GITHUB_WEBHOOK_SECRET:-}"
      AO_CLOUD_GITHUB_STATE_KEY: "${AO_CLOUD_GITHUB_STATE_KEY:-}"
      AO_CLOUD_GITHUB_INSTALL_TTL: "${AO_CLOUD_GITHUB_INSTALL_TTL:-10m}"
      AO_CLOUD_GITHUB_WEBHOOK_MAX_BYTES: "${AO_CLOUD_GITHUB_WEBHOOK_MAX_BYTES:-2097152}"
    group_add:
      - "${AO_CLOUD_DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${AO_CLOUD_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ao-cloud-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker-image:
    profiles: ["worker-image"]
    image: "${AO_CLOUD_DOCKER_WORKER_IMAGE:-ao-cloud-worker:local}"
    build:
      context: .
      target: worker
      args:
        AGENT_BROWSER: "1"
