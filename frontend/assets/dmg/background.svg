<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
	<!--
		Source for the macOS install window background (background.png and
		background@2x.png beside this file). Regenerate after editing:
		  node scripts/render-dmg-assets.mjs
		The image sets the window FRAME size, so Finder's title bar covers the
		bottom ~32pt: keep everything within the top 368pt. Geometry is coupled
		to DMG_LAYOUT in scripts/build-mac-dmg.mjs: the app icon is centred at
		(170, 172) and the Applications link at (490, 172), both 128pt.
	-->
	<defs>
		<linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f8f8f9" />
			<stop offset="1" stop-color="#eef0f2" />
		</linearGradient>
	</defs>
	<rect width="660" height="400" fill="url(#surface)" />

	<g fill="none" stroke="#a3a9b1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
		<path d="M276 172 H382" />
		<path d="M375 166 L383 172 L375 178" />
	</g>
	<text
		x="330"
		y="200"
		text-anchor="middle"
		font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
		font-size="12"
		fill="#6e7681"
	>Drag to Applications</text>
</svg>
