version: 2
name: devco-creative
description: >-
  DevCo Creative & Media (Sprint 0 draft): visual assets, themed documents and GIFs by the
  devco-creative-media employee. No shell and no web access, so nothing is downloaded or
  installed; assets go only under .devco/media/<id>/ (deterministic scope check). A separate
  designer reviews against the brief and brand. Commit + draft PR; nothing merges.
nodes:
  - { id: start, type: start }
  - { id: snapshot, type: check, name: Record base (Cezar), command: 'node "$CEZ_PROTECTED_PATHS" --record', sandbox: true }

  - id: create
    type: agent
    runner: claude
    confined: true
    name: Create assets
    skill: devco-creative-media
    prompt: |
      {{task}}

      Rules: write ONLY under the `.devco/media/<id>/` folder the task names, plus
      `<that folder>/report.md`. Use only fonts and assets shipped with your skills, in the repo,
      or given in the task. No downloads, no installs, no paid generation APIs. Where PNG tooling
      is missing, deliver SVG or HTML and say so in the report.
    allowedTools: ["Read(./**)", "Write(.devco/media/**)", "Edit(.devco/media/**)", "Grep(./**)", "Glob(./**)"]

  - { id: scope, type: check, name: Media scope check (Cezar), command: 'node "$CEZ_SCOPE_CHECK" --kinds media', sandbox: true }
  - { id: final_scope, type: check, name: Media scope check before commit (Cezar), command: 'node "$CEZ_SCOPE_CHECK" --kinds media', sandbox: true }

  - id: review
    type: agent
    runner: claude
    confined: true
    name: Design review
    skill: devco-product-designer
    prompt: |
      You did not make these assets. Check them against the task brief and the project's brand
      rules: does each asset answer the brief, are text and colours readable (contrast), are fonts
      and images licensed for use as the report claims, and is anything a real brand, logo or
      person's likeness that was not provided? Do not edit any file. Report BLOCKER / MAJOR / MINOR.
      Approve only if there is no BLOCKER or MAJOR finding.

      Task: {{task}}
    verdicts: [approve, changes]
    allowedTools: ["Read(./**)", "Grep(./**)", "Glob(./**)"]
  - { id: review_loop, type: loop, max: 1 }
  - id: fix_review
    type: agent
    runner: claude
    confined: true
    name: Address review
    session: { continue: create }
    prompt: |
      The design reviewer requested changes. Fix every BLOCKER and MAJOR finding:
      {{nodes.review.summary}}
    allowedTools: ["Read(./**)", "Write(.devco/media/**)", "Edit(.devco/media/**)", "Grep(./**)", "Glob(./**)"]

  # Cezar's own secret scan (script shipped with Cezar, not in this repo); required before any commit.
  - { id: secret_scan, type: check, name: Secret scan (Cezar), command: 'node "$CEZ_SECRET_SCAN"', sandbox: true }
  - { id: commit, type: git.commit, message: "devco-creative: media assets with report" }
  - { id: pr, type: github.draft-pr }
  - { id: ok, type: end, status: success }
  - { id: failed, type: end, status: failed }

edges:
  - { from: start, to: snapshot }
  - { from: snapshot.pass, to: create }
  - { from: snapshot.fail, to: failed }
  - { from: create.done, to: scope }
  - { from: scope.pass, to: review }
  - { from: scope.fail, to: failed }
  - { from: review.approve, to: final_scope }
  - { from: final_scope.pass, to: secret_scan }
  - { from: final_scope.fail, to: failed }
  - { from: secret_scan.pass, to: commit }
  - { from: secret_scan.fail, to: failed }
  - { from: review.changes, to: review_loop }
  - { from: review_loop.repeat, to: fix_review }
  - { from: review_loop.exhausted, to: failed }
  - { from: fix_review.done, to: scope }
  - { from: commit.done, to: pr }
  - { from: commit.nothing, to: failed }
  - { from: pr.created, to: ok }
