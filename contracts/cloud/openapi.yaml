          type: string
          format: uri
          description: >-
            The session's workspace page on the organization's own
            (bring-your-own) Coder deployment, as
            <baseUrl>/@<owner>/<workspace name>. Present only for sessions on
            a bring-your-own Coder connection, from the session's creation
            (the workspace may not exist yet); never set for AO's managed
            Coder or other providers.
        activeTurn:
          $ref: "#/components/schemas/Turn"
        isTerminated:
          type: boolean
        requestedOutput:
          $ref: "#/components/schemas/RequestedOutput"
        requestedBy:
          type: object
          additionalProperties: false
          description: The guest the session was started for, when someone the project was shared with asked its orchestrator for it. They may write in it; the rest of the project share watches.
          required: [userId, name]
          properties:
            userId:
              type: string
            name:
              type: string
        outputType:
          $ref: "#/components/schemas/SessionOutputType"
        artifactCount:
          type: integer
          minimum: 0
          description: >-
            How many committed artifact files the session has, on the session
            read and list routes while the deployment keeps artifacts.
        artifactsUpdatedAt:
          type: string
          format: date-time
          description: >-
            When the newest of the session's artifact files was committed. It
            changes whenever a commit changes the files, and only then, so a
            client can keep a file list until it moves. Absent without files.
        artifactFiles:
          type: array
          description: >-
            The session's committed artifact files, on the session read route
            while the deployment keeps artifacts. The list route sends only
            artifactCount; listSessionArtifacts returns the files.
          items:
            $ref: "#/components/schemas/SessionArtifact"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequestedOutput:
      type: string
      enum: [artifact]
      description: >-
        The deliverable a session was created for. artifact asks the agent for
        a file in its artifact directory instead of a pull request.
    SessionOutputType:
      type: string
      enum: [none, pr, artifact, pr_artifact]
      description: What the session owns, a pull request, artifact files, or both.
    SessionArtifact:
      type: object
      additionalProperties: false
      required: [path, name, kind, contentType, size, sha256, updatedAt]
      properties:
        path:
          type: string
          description: Slash-separated path in the session's artifact directory.
