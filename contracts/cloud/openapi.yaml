        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: When the link was revoked. A revoked link serves nothing but still uses a slot.
    ArtifactShareEnvelope:
      type: object
