        kind:
          type: string
          enum: [html, markdown, file]
        contentType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        updatedAt:
          type: string
          format: date-time
          description: >-
            When the control plane last committed a new version of the file.
    SessionArtifactList:
      type: object
