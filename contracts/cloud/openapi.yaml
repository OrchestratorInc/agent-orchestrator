openapi: 3.1.0
info:
  title: AO Cloud Public API
  version: 1.0.0
  description: |
    Client-facing contract for AO Cloud. The Cloud server implementation lives
    under `cloud/` in this repository, while this file is the versioned contract
    used to generate the runtime-neutral client types. The worker surface
    documents the exact outbound HTTP protocol used by sandbox workers,
    including one-time bootstrap, rotating credentials, fenced turn execution,
    orchestration, and durable workspace and terminal transport.
    This is the currently documented Cloud API subset; broader route parity is
    tracked in https://github.com/Untrivial-ai/agent-orchestrator/issues/6220.
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Agents
  - name: Projects
  - name: Sessions
  - name: GitHub
  - name: Pull Requests
  - name: Reviews
  - name: Events
  - name: Terminal
  - name: Workspace
  - name: Artifacts
  - name: Providers
  - name: Worker Lifecycle
  - name: Worker Execution
  - name: Worker Orchestration
  - name: Worker Transport
paths:
  /api/cloud/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [Account]
      responses:
        "200":
          description: The authenticated user and their active organization memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/me/providers:
    get:
      operationId: listUserProviderConnections
      tags: [Providers]
      responses:
        "200":
          description: Redacted provider connections owned by the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnections]
                properties:
                  providerConnections:
                    type: array
                    items:
                      $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/me/providers/{agent}:
    parameters:
      - name: agent
        in: path
        required: true
        schema:
          type: string
          enum: [claude-code, codex, cursor, opencode]
    put:
      operationId: putUserAgentConnection
      tags: [Providers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAgentProviderConnectionInput"
      responses:
        "200":
          description: The validated personal coding-agent credential was encrypted and stored.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnection]
                properties:
                  providerConnection:
                    $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUserAgentConnection
      tags: [Providers]
      responses:
        "204":
          description: The personal coding-agent credential was disconnected.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/me/artifact-shares:
    get:
      operationId: listArtifactShares
      tags: [Artifacts]
      description: >-
        Lists the signed-in user's public artifact share links, newest first,
        with how many they may hold. Revoked links are listed with revokedAt:
        they no longer serve but still use a slot, so used counts them. Available only when the development-only
        AO_CLOUD_ARTIFACT_SHARES flag is on; otherwise 404.
      responses:
        "200":
          description: The user's share links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactShareList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createArtifactShare
      tags: [Artifacts]
      description: >-
        Publishes the request body, one file from a local session, as the
        link of the document named by project, feature and name. A new
        document gets a new public link at <project>-<feature>-<email> under
        the share origin; a taken name gets a -2, -3, ... suffix. Publishing
        a document that already has a link replaces the version that link
        serves: the URL and slot stay, the earlier version is no longer
        served, and the response is 200 with replaced true. A revoked link
        is restored the same way.
        Content-Length and X-AO-Artifact-SHA256 are required. Returns 409
        artifact_share_limit_reached when a new document would exceed the
        user's limit of links; revoked links count toward it.
      parameters:
        - $ref: "#/components/parameters/ArtifactShareName"
        - name: project
          in: query
          schema:
            type: string
        - name: feature
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/ArtifactShareSHA256"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The document's existing link, now serving the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSharePublishResult"
        "201":
          description: The new share link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSharePublishResult"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/me/artifact-shares/{shareId}:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateArtifactShare
      tags: [Artifacts]
      description: >-
        Replaces the file an existing link serves. The link keeps its URL and
        does not count against the limit again. name must match the link's
        file name, which is part of its document; another name returns 409
        artifact_share_name_changed, and the renamed file is published as a
        new link with POST.
      parameters:
        - $ref: "#/components/parameters/ArtifactShareName"
        - $ref: "#/components/parameters/ArtifactShareSHA256"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The updated share link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactShareEnvelope"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteArtifactShare
      tags: [Artifacts]
      description: >-
        Revokes a link: it stops serving at once and its stored file is
        deleted after a grace period. The link still uses its slot, so
        revoking never makes room for a new document. Publishing the same
        document again restores it. A link already revoked returns 404.
      responses:
        "204":
          description: The link was revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user:
    get:
      operationId: getGitHubUserConnection
      tags: [GitHub]
      responses:
        "200":
          description: The authenticated user's account-wide GitHub connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disconnectGitHubUser
      tags: [GitHub]
      responses:
        "204":
          description: The account-wide GitHub authorization was revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user/authorize:
    post:
      operationId: startGitHubUserAuthorization
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived account-wide GitHub authorization attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserAuthorizationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user/callback:
    get:
      operationId: completeGitHubUserAuthorization
      tags: [GitHub]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GitHub authorization completion page.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/agents:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        "200":
          description: Agent profiles supplied by the runtime and organization host.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentProfile"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProjects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of projects in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [Projects]
      responses:
        "200":
          description: Project and normalized settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Project settings updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      tags: [Projects]
      responses:
        "202":
          description: Project archived and sandbox teardown accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}/settings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateProjectSettings
      tags: [Projects]
      description: Merge supplied settings only. Omitted fields are preserved, nested role objects merge, and reviewers replace the array. Null is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSettingsInput"
      responses:
        "200":
          description: Validated settings persisted atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubInstallations
      tags: [GitHub]
      responses:
        "200":
          description: GitHub App installations connected to the organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startGitHubInstallation
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived GitHub App installation attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: syncGitHubInstallation
      tags: [GitHub]
      responses:
        "202":
          description: Repository synchronization accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: disconnectGitHubInstallation
      tags: [GitHub]
      responses:
        "200":
          description: The GitHub App installation was disconnected from AO.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubRepositories
      tags: [GitHub]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of repositories currently or historically granted to the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createProjectFromGitHub
      tags: [GitHub, Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubProjectInput"
      responses:
        "201":
          description: Project created from an actively granted GitHub repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/scratch:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createGitHubScratchProject
      tags: [GitHub, Projects, Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubScratchProjectInput"
      responses:
        "201":
          description: GitHub repository, AO project, and first orchestrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGitHubScratchProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/standalone:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createStandaloneProject
      tags: [Projects]
      description: >-
        Create a project with no repository. Its sessions start in an empty,
        git-initialized folder, for a workspace template that brings its own
        code or work that needs none. It takes the same config as a repository
        project except additional repositories, and cannot open pull requests.
        Its repositoryUrl is a placeholder, https://scratch.ao.local/<id>.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStandaloneProjectInput"
      responses:
        "201":
          description: Standalone project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of sessions in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSession
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/wake:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: wakePausedSessions
      tags: [Sessions]
      description: Ask the reconciler to resume the user's idle-paused sandboxes.
      responses:
        "202":
          description: The resume requests were accepted for asynchronous processing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [woken]
                properties:
                  woken:
                    type: integer
                    format: int64
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [Sessions]
      responses:
        "200":
          description: Session details.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [Sessions]
      responses:
        "202":
          description: Session sandbox deletion was requested; durable history is retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/interface-transition:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionInterfaceTransition
      tags: [Sessions]
      responses:
        "200":
          description: Interface-switch readiness and the active transition, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInterfaceTransitionStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startSessionInterfaceTransition
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionInterfaceTransitionInput"
      responses:
        "202":
          description: Interface switch accepted for asynchronous processing.
          content:
            application/json:
              schema:
                type: object
                required: [transition]
                properties:
                  transition:
                    $ref: "#/components/schemas/SessionInterfaceTransition"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: cancelSessionInterfaceTransition
      tags: [Sessions]
      responses:
        "200":
          description: Interface switch cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/interface-transition/{transitionId}/notice-acknowledgement:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - name: transitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: acknowledgeSessionInterfaceTransitionNotice
      tags: [Sessions]
      responses:
        "200":
          description: Interface-switch failure or recovery notice acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/startup-retry:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: retrySessionStartup
      tags: [Sessions]
      description: >-
        Retries a session whose worker never started (its startupError explains
        why). The startup window, repair count and startup error are reset and
        the worker bootstrap runs again against the existing sandbox; a
        bring-your-own workspace is never recreated. Returns 409
        startup_retry_unavailable when the worker has already checked in or the
        session is not meant to be running.
      responses:
        "202":
          description: The retry was accepted for asynchronous processing.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/children:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionChildren
      tags: [Sessions]
      description: >-
        Lists the sessions this orchestrator spawned, newest first, with each
        child's pull requests. Terminated children are included; a session
        that spawned nothing returns an empty page.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the orchestrator's child sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionChildrenPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionArtifacts
      tags: [Artifacts]
      description: >-
        Lists the session's committed artifact files, sorted by path. Reads
        Postgres only and never wakes or resumes the sandbox. Present only
        when the deployment reports offering.artifacts; otherwise 404.
      responses:
        "200":
          description: The session's artifact files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionArtifactList"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/artifacts/access:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createSessionArtifactAccess
      tags: [Artifacts]
      description: >-
        Returns a short-lived path prefix that serves this session's artifact
        files without a bearer header, for a sandboxed frame. Append a file's
        URL-escaped path to filesPrefix; relative links inside an HTML file
        resolve against the same prefix. A prefix lasts ten minutes and
        stops working when the caller leaves the organization; request a new
        one before expiresAt.
      responses:
        "200":
          description: The file access prefix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionArtifactAccess"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionPullRequests
      tags: [Pull Requests]
      responses:
        "200":
          description: Normalized provider pull-request observations for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPullRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviews:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionReviewState
      tags: [Reviews]
      responses:
        "200":
          description: AO review planning state and recorded runs for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviews/trigger:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: triggerSessionReviews
      tags: [Reviews]
      responses:
        "200":
          description: The current commit was already reviewed or is ineligible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        "201":
          description: A reviewer terminal was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviews/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: cancelSessionReviews
      tags: [Reviews]
      responses:
        "200":
          description: Review state after cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviews/{reviewRunId}/send:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - name: reviewRunId
