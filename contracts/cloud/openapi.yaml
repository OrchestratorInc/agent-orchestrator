          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "202":
          description: Message accepted and durably appended.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/chat-models:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listChatModels
      tags: [Sessions]
      description: Model and reasoning-effort choices available to this session's agent.
      responses:
        "200":
          description: Available Chat models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModelsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/turns/{turnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: cancelTurn
      tags: [Sessions]
      description: Stop a turn. Allowed for the person whose message started it, the composer lease holder, the session's creator, and the organization's owners and admins; anyone else gets 403.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation was durably requested for the turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/composer/acquire:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: composerAcquire
      tags: [Sessions]
      description: Take the composer lease when it is free and nobody is ahead in line, or renew it when already held. Viewers are refused with 403.
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it. A refusal is this same answer with granted false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/composer/renew:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: composerRenew
      tags: [Sessions]
      description: Extend a held grant. typing reports a keystroke since the last renewal; a holder who has not typed for 45 seconds loses the lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposerGrantInput"
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it. A refusal is this same answer with granted false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/composer/release:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: composerRelease
      tags: [Sessions]
      description: Give up a held grant; the next person in line gets the lease. Releasing a grant no longer held does nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposerGrantInput"
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it. A refusal is this same answer with granted false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/composer/queue:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: composerRequestTurn
      tags: [Sessions]
      description: Get in line for the composer lease. A free lease passes at once to the first person in line who has the session open.
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it. A refusal is this same answer with granted false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: composerLeaveQueue
      tags: [Sessions]
      description: Leave the line for the composer lease.
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it. A refusal is this same answer with granted false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/composer/takeover:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: composerTakeOver
      tags: [Sessions]
      description: Take the composer lease from whoever holds it. Only the session's creator and the organization's owners and admins may; others get 403.
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it. A refusal is this same answer with granted false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/composer/draft:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: composerPublishDraft
      tags: [Sessions]
      description: Share what the holder is typing, so everyone else in the session sees it live, read-only. Counts as a keystroke, renewing the grant. Anyone not holding the grant they present is refused with granted false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposerGrantInput"
      responses:
        "200":
          description: The composer lease after the request, and whether the caller holds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposerLeaseAnswer"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/chat-settings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: sessionSetChatSettings
      tags: [Sessions]
      description: Set the model, reasoning effort, mode and approval mode the session's turns run with. Only the session's owner may; everyone else gets 403 and sees the change on their live stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionChatSettings"
      responses:
        "200":
          description: The session's chat settings.
          content:
            application/json:
              schema:
                type: object
                required: [chatSettings]
                properties:
                  chatSettings:
                    $ref: "#/components/schemas/SessionChatSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/pull-requests/{number}/merge-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: requestPullRequestMerge
      tags: [Sessions]
      description: Ask the owner of a shared project to merge one of the session's pull requests. Only someone the project or session was shared with, who may write in the session, asks; a merge by them is refused with MERGE_NEEDS_APPROVAL. Asking again while a request is pending returns it. The session's creator is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prUrl]
              properties:
                prUrl:
                  type: string
      responses:
        "200":
          description: The pending merge request.
          content:
            application/json:
              schema:
                type: object
                required: [mergeRequest]
                properties:
                  mergeRequest:
                    $ref: "#/components/schemas/MergeRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}/merge-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMergeRequests
      tags: [Sessions]
      description: A project's merge requests, pending first, then newest first. A member of the organization sees them all; someone the project was shared with sees their own.
      responses:
        "200":
          description: The merge requests.
          content:
            application/json:
              schema:
                type: object
                required: [mergeRequests]
                properties:
                  mergeRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/MergeRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/merge-requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveMergeRequest
      tags: [Sessions]
      description: Merge the requested pull request as the approving owner (the session's creator, or an organization owner or admin), through the same readiness checks as their own merge, and tell the guest. A pull request that cannot merge leaves the request pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHeadSha]
              properties:
                expectedHeadSha:
                  type: string
      responses:
        "202":
          description: GitHub accepted the merge; the request is recorded as merged.
          content:
            application/json:
              schema:
                type: object
                required: [mergeRequest]
                properties:
                  mergeRequest:
                    $ref: "#/components/schemas/MergeRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/merge-requests/{requestId}/reject:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectMergeRequest
      tags: [Sessions]
      description: Decline a pending merge request and tell the guest.
      responses:
        "200":
          description: The declined request.
          content:
            application/json:
              schema:
                type: object
                required: [mergeRequest]
                properties:
                  mergeRequest:
                    $ref: "#/components/schemas/MergeRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/session-participants:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listSessionParticipants
      tags: [Sessions]
      description: Who is in each of the named sessions that someone has shared, for a board. Sessions the caller may not open, or that nobody has shared, are left out. Reading this does not make the caller present in any session.
      parameters:
        - name: sessionId
          in: query
          required: false
          description: A session to describe; repeat for each, at most 100.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        "200":
          description: The shared sessions among those asked for, in the order asked.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SharedSessionParticipants"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/turns/{turnId}/steer:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: steerTurn
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "202":
          description: Guidance for the active turn accepted.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/TurnSteeredEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/approvals/{requestId}/decide:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideChatApproval
      tags: [Sessions]
      description: Answer an approval prompt. Allowed for the same people who may stop its turn (see cancelTurn); anyone else gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatApprovalDecisionInput"
      responses:
        "202":
          description: Approval decision accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/chat-events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: replayClientEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/EventLimit"
        - $ref: "#/components/parameters/EventTypes"
      responses:
        "200":
          description: Client-visible events after the supplied sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEventPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamClientEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/EventTypes"
        - name: live
          in: query
          required: false
          description: |
            1 opts this stream in to the session's live state. The caller is
            listed as a viewer while the stream stays open, and the stream also
            carries session.live frames (see SessionLiveState) whenever that
            state changes. Omitted, the stream carries only ClientEvents.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: |
            Replay followed by live client-visible events. Each SSE data field
            contains a ClientEvent; the SSE id is its sequence. With live=1 the
            stream also carries `event: session.live` frames whose data is a
            SessionLiveState. Those frames have no SSE id and never move the
            replay cursor; each one replaces the previous state.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminal-ticket:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createTerminalTicket
      tags: [Terminal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/TerminalKind"
      responses:
        "201":
          description: Short-lived, single-use terminal access ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicket"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/terminal:
    get:
      operationId: connectTerminal
      tags: [Terminal]
      summary: Upgrade to a terminal WebSocket using a short-lived ticket.
      description: |
        On the agent terminal, keystrokes are talking to the agent, so they need
        the session's composer lease: typing takes it when it is free and nobody
        is waiting, and renews it while the typist keeps typing. While someone
        else holds it or is waiting for it, input is dropped and the server
        sends `{"type":"input_refused","inputId":...,"message":...}` instead of
        `input_ack`; the connection stays open.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TerminalKind"
      responses:
        "101":
          description: WebSocket protocol upgrade accepted.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/artifact-files/{token}/{path}:
    get:
      operationId: getSessionArtifactFile
      tags: [Artifacts]
      summary: Read one artifact file through an access prefix.
      security: []
      description: >-
        Streams the committed version of one artifact file. The token comes
        from createSessionArtifactAccess and binds one organization and
        session. Every response carries a Content-Security-Policy sandbox
        without allow-same-origin, X-Content-Type-Options nosniff, and an
        ETag of the file's SHA-256. A listed file whose stored object is gone
        returns 404 with code artifact_unavailable.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: The file's path in the artifact directory; may contain slashes.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The file bytes, with Content-Type from the file extension.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "304":
          description: The file has not changed since the given ETag.
        "401":
          description: The access token is invalid or expired (artifact_access_invalid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/files:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/WorkspaceRepository"
    get:
      operationId: listWorkspaceFiles
      tags: [Workspace]
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: ""
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries in a workspace directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEntryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/file:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/WorkspaceRepository"
    get:
      operationId: readWorkspaceFile
      tags: [Workspace]
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: UTF-8 workspace file contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: writeWorkspaceFile
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceFileWriteInput"
      responses:
        "200":
          description: The updated UTF-8 workspace file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/file/diff:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/WorkspaceRepository"
    get:
      operationId: readWorkspaceDiffFile
      tags: [Workspace]
      description: Read one cloud workspace file with its bounded unified diff.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Docker workspace file review details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiffFileDetail"
        "501":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/diff:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/WorkspaceRepository"
    get:
      operationId: getWorkspaceDiff
      tags: [Workspace]
      description: Changed-file summary and line counts relative to the session compare base.
      responses:
        "200":
          description: Workspace changes relative to the session compare base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiff"
        "501":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkspaceRepositories
      tags: [Workspace]
      description: >-
        The session's repository checkouts: the main one and, for a project
        with additional repositories, one per additional repository. A
        checkout's name is the value the workspace endpoints take as
        ?repository=. A single-repository session lists only the main
        checkout.
      responses:
        "200":
          description: The session's repository checkouts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRepositoryList"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/provider-connections:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProviderConnections
      tags: [Providers]
      responses:
        "200":
          description: Redacted provider connection metadata. Secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnections]
                properties:
                  providerConnections:
                    type: array
                    items:
                      $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/provider-connections/agents/{provider}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [claude-code, codex, cursor, opencode]
    put:
      operationId: putAgentProviderConnection
      tags: [Providers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAgentProviderConnectionInput"
      responses:
        "200":
          description: The validated coding-agent credential was encrypted and stored.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnection]
                properties:
                  providerConnection:
                    $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAgentProviderConnection
      tags: [Providers]
      responses:
        "204":
          description: The coding-agent credential was disconnected.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sandbox-provider:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    put:
      operationId: putOrgSandboxProvider
      tags: [Providers]
      description: >-
        Set the organization's default sandbox provider: the one sessions get
        when neither the request nor the project picks one (org admins). Only
        an organization offered more than one provider may set it (409
        no_provider_choice otherwise); a provider the deployment does not offer
        is 403 provider_forbidden. An empty defaultProvider clears the choice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutOrgSandboxProviderInput"
      responses:
        "200":
          description: The organization's offering with its new default provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offering"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/coder-config:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrgCoderConfig
      tags: [Providers]
      description: The organization's bring-your-own Coder connection, without its token. 403 provider_forbidden when the organization may not run on Coder; configured=false when it has no connection.
      responses:
        "200":
          description: The connection, or configured=false when there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCoderConfigResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putOrgCoderConfig
      tags: [Providers]
      description: >-
        Create or replace the organization's bring-your-own Coder connection
        (org admins). The token is required on first save and when baseUrl
        changes; otherwise an omitted token keeps the stored one. An omitted
        owner is derived from the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutOrgCoderConfigInput"
      responses:
        "200":
          description: The validated connection was stored; the token is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCoderConfigResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOrgCoderConfig
      tags: [Providers]
      responses:
        "204":
          description: The connection was removed.
        "409":
          description: >-
            connection_in_use: sessions not yet fully deleted still run on the
            connection, so it is kept. Remove their projects or sessions first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/coder-templates/{templateId}/parameters:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCoderTemplateParameters
      tags: [Providers]
      description: >-
        The coder_parameter inputs the template's active version declares, read
        from the organization's own Coder connection (or the deployment's Coder
        when it has none). 403 provider_forbidden for organizations without
        Coder; 404 coder_template_not_found for an unknown template; 502
        coder_unavailable when Coder cannot be read.
      responses:
        "200":
          description: The template's parameters in Coder's order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [parameters]
                properties:
                  parameters:
                    type: array
                    items:
                      $ref: "#/components/schemas/CoderTemplateParameter"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/coder-templates/{templateId}/parameters/evaluate:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: evaluateCoderTemplateParameters
      tags: [Providers]
      description: >-
        The template's parameters with the given draft values applied. A
        template using Coder's dynamic parameters can declare a parameter only
        for certain values of another (for example a custom repository URL once
        "Other" is selected); evaluating with the draft values lists it, and
        each parameter carries Coder's diagnostics for its value. A template on
        Coder's classic parameter flow, or a Coder without dynamic parameters,
        answers with the same static parameters as the GET. 403
        provider_forbidden for organizations without Coder; 404
        coder_template_not_found for an unknown template; 422 validation_error
        for invalid values; 502 coder_unavailable when Coder cannot be read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values:
                  type: object
                  description: Draft parameter values by name, encoded as in project config coder.parameters.
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: The template's parameters for these values, in Coder's order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [parameters]
                properties:
                  parameters:
                    type: array
                    items:
                      $ref: "#/components/schemas/CoderTemplateParameter"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/bootstrap:
    post:
      operationId: bootstrapWorker
      tags: [Worker Lifecycle]
      security: []
      summary: Redeem a one-time bootstrap ticket.
      description: |
        The bootstrap token is consumed atomically and cannot be replayed. A
        successful response assigns the worker epoch and returns the first
        short-lived worker token. The token carries the ticket's scopes and
        must never be logged or persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerBootstrapInput"
      responses:
        "200":
          description: Bootstrap succeeded and the one-time ticket was consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The bootstrap token is missing, invalid, expired, or already used.
          $ref: "#/components/responses/Error"
        "404":
          description: Worker bootstrap is not enabled on this deployment.
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/heartbeat:
    post:
      operationId: heartbeatWorker
      tags: [Worker Lifecycle]
      security:
        - workerAuth: []
      description: |
        Records worker liveness, promotes a bootstrapping sandbox to running,
        and returns a newly issued token for the same worker identity, epoch,
        and scopes. The prior token is not revoked by renewal and remains valid
        until it expires unless the worker epoch is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatInput"
      responses:
        "200":
          description: Liveness was recorded and a replacement token was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerHeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/events:
    post:
      operationId: publishWorkerEvent
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Publishes one allowlisted event. `agent.activity` carries an explicit
        coding-agent lifecycle hook signal. `worker.ready` must identify the
        authenticated worker and epoch. `chat.assistant_delta` is fenced by both
        the token epoch and the claimed turn attempt. `workspace.setup` reports
        the outcome of the project's Setup commands and is appended to the
        session's event stream. `workspace.script.step` reports one step of a
        Setup run (its start, live output updates and outcome, and the steps a
        failure skipped); its output is redacted again and bounded before it
        is appended. A control plane that predates an event type refuses it
        with 400 `INVALID_EVENT_TYPE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerEventInput"
      responses:
        "202":
          description: The event was durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The turn has finished or another epoch or attempt owns it.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/claim:
    post:
      operationId: claimWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Atomically claims the oldest queued turn for the authenticated worker's
        session. Reclaiming work from an older worker epoch increments
        `attempt`. No server lease identifier or expiry is returned. An empty
        queue is represented by HTTP 200 with `turn: null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: The claimed turn, or null when no turn is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerClaimTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
  /api/cloud/v1/worker/turns/{turnId}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    get:
      operationId: getWorkerTurnCancellation
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Returns cancellation intent only if the token epoch and supplied
        positive attempt still own the active turn.
      parameters:
        - $ref: "#/components/parameters/WorkerTurnAttempt"
      responses:
        "200":
          description: Current cancellation state for this fenced attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCancellationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The turn has finished or another epoch or attempt owns it.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/{turnId}/complete:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: completeWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Completes the exact claimed attempt. `cancelled: true` records an
        interrupted completion. Repeating the same callback after that attempt
        has finished succeeds with `alreadyFinished: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteTurnInput"
      responses:
        "200":
          description: The fenced completion was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerFinishTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Another epoch or attempt owns the turn.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/turns/{turnId}/fail:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: failWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Fails the exact claimed attempt with a non-empty error message. A
        repeated callback for the same finished attempt is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailTurnInput"
      responses:
        "200":
          description: The fenced failure was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerFinishTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Another epoch or attempt owns the turn.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/credential:
    get:
      operationId: getWorkerCredential
      parameters:
        - name: reviewRunId
          in: query
          required: false
          description: Select the snapshotted reviewer credential for a running review owned by this session.
          schema:
            type: string
            format: uuid
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Returns the valid default coding-agent credential selected by the
        session harness, or the durable reviewer harness when reviewRunId is supplied.
        The secret must never be logged or persisted.
      responses:
        "200":
          description: The decrypted session-scoped coding-agent credential.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCredentialResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/checkout-grant:
    post:
      operationId: createWorkerCheckoutGrant
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Brokers a fresh repository-scoped GitHub installation token. Repository
        identity is derived from the worker session and cannot be supplied by
        the sandbox. The token must never be logged or persisted.
      responses:
        "200":
          description: A short-lived checkout grant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCheckoutGrantResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/artifacts/manifest:
    post:
      operationId: compareWorkerArtifactManifest
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Compares the worker's artifact directory listing against the
        session's committed files and returns the paths whose size or SHA-256
        differ, including new paths. Requires `worker:connect`. Absent when
        the deployment does not keep artifacts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerArtifactManifestInput"
      responses:
        "200":
          description: The changed paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerArtifactManifestResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/artifacts/blob/{path}:
    put:
      operationId: putWorkerArtifactBlob
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Streams one artifact file to storage under the worker's own session.
        Content-Length is required and the body's SHA-256 must match the
        X-AO-Artifact-SHA256 header; storage rejects a mismatch without
        keeping it. Returns the stored version for the commit. Requires
        `worker:connect`.
      parameters:
        - name: path
          in: path
          required: true
          description: The file's path in the artifact directory; may contain slashes.
          schema:
            type: string
        - name: X-AO-Artifact-SHA256
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The stored version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerArtifactBlobResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "411":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          description: The body does not match its SHA-256 (checksum_mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/artifacts/commit:
    post:
      operationId: commitWorkerArtifacts
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Records uploaded versions and deletions for the worker's own session
        in one transaction and appends an artifact.changed event. Each
        version must exist with the given size and SHA-256
        (artifact_version_missing or artifact_version_mismatch otherwise).
        Requires `worker:connect`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerArtifactCommitInput"
      responses:
        "204":
          description: The changes are committed.
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/children:
    get:
      operationId: listWorkerChildren
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      description: >-
        Lists this orchestrator's direct child sessions with their pull
        requests. Terminated children are hidden unless includeTerminated.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: includeTerminated
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of direct child sessions owned by this orchestrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionChildrenPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createWorkerChild
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerChildInput"
      responses:
        "201":
          description: A worker child was created under this orchestrator.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/children/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: deleteWorkerChild
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      description: Requests deletion of a direct child owned by the authenticated orchestrator.
      responses:
        "202":
          description: Child sandbox deletion was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/children/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendWorkerChildMessage
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "202":
          description: The message was durably appended to the direct child.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/parent/messages:
    post:
      operationId: reportToParent
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      description: >-
        Delivers a child worker's message into the conversation of the
        orchestrator that spawned it. Requires the worker:report scope, which
        is issued only to sessions with an orchestrator parent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "202":
          description: The message was durably appended to the parent orchestrator.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/transport/claim:
    post:
      operationId: claimWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Claims the next durable workspace or terminal command for the token's
        session and epoch. The internal claim lasts 10 seconds and may be
        reclaimed up to three times. The positive claim attempt is returned and
        must be echoed by completion or failure callbacks. No work is represented
        by HTTP 200 with `request: null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: The claimed command, or null when none is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerClaimTransportResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
  /api/cloud/v1/worker/transport/{requestId}/complete:
    parameters:
      - $ref: "#/components/parameters/WorkerRequestId"
    post:
      operationId: completeWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Completes a claimed durable command. The worker token epoch, request
        status, request expiry, and positive claim attempt are checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteTransportInput"
      responses:
        "200":
          description: The command result was durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The command is no longer claimed or has expired.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/transport/{requestId}/fail:
    parameters:
      - $ref: "#/components/parameters/WorkerRequestId"
    post:
      operationId: failWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Records a bounded machine-readable error for a claimed command. The
        token epoch, request status, expiry, and positive claim attempt are
        checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailTransportInput"
      responses:
        "200":
          description: The command failure was durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The command is no longer claimed or has expired.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/interface/chat-start-fallback:
    post:
      operationId: fallBackWorkerChatStart
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        The session's current worker reports it cannot start the session's
        Chat controller (code CHAT_ADAPTER_UNAVAILABLE: Claude's Chat needs the
        Claude ACP adapter, which the workspace lacks and the worker could not
        install in time; CHAT_START_UNSUPPORTED: the worker cannot start
        sessions in Chat). A session created in Chat that never started (no
        interface transition ever touched it, no turn was claimed or settled,
        and the agent never reported its conversation) moves to tui: its
        terminal launches without the prompt and its queued first turn stays
        for the terminal's turn forwarder, which delivers it once after the
        agent starts (a session whose launch still carries the prompt has that
        turn settled instead), and a failed tui-to-chat interface transition
        carries the notice the desktop shows. A session the person switched to Chat, or
        whose Chat already ran, does not move; the worker then stays on Chat.
        Requires the worker:connect scope. A worker that reports the
        agent.chat-start capability uses it; for one that does not, the
        control plane makes the same move itself at bootstrap and reconnect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerChatStartFallbackInput"
      responses:
        "200":
          description: Whether the session moved to tui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerChatStartFallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
        "422":
          description: The code is not one the control plane knows.
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/terminals/agent:
    post:
      operationId: ensureWorkerAgentTerminal
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: Returns the epoch-scoped persistent terminal used by the interactive agent TUI.
      responses:
        "200":
          description: The agent terminal is ready for process attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAgentTerminalResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/terminals/{terminalId}/output:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: publishWorkerTerminalOutput
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Appends one base64-encoded output frame to a live workspace terminal.
        The terminal and worker token must have the same current epoch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTerminalOutputInput"
      responses:
        "202":
          description: The output frame was appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerTerminalOutputResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The terminal is closed, expired, over quota, or no longer current.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/terminals/{terminalId}/exit:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: publishWorkerTerminalExit
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: Marks the epoch-scoped agent or workspace terminal process as exited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTerminalExitInput"
      responses:
        "200":
          description: The terminal exit was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/notification-events:
    post:
      operationId: publishWorkerNotificationEvent
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: Durably accepts one agent notification event for the authenticated worker epoch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentNotificationEvent"
      responses:
        "200":
          description: The exact event was already durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAcceptance"
        "202":
          description: The event was durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAcceptance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/notifications:
    get:
      operationId: listCloudNotifications
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: status
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recipient-scoped cloud notification inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/notification-events:
    get:
      operationId: listCloudNotificationEvents
      tags: [Events]
      description: Returns durable events as JSON, or an SSE replay/live stream when requested with Accept text/event-stream.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: Ordered durable cloud notification events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEventPage"
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/notifications/{notificationId}:
    patch:
      operationId: markCloudNotificationRead
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  const: read
      responses:
        "200":
          description: The notification was marked read.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/notifications/read-all:
    post:
      operationId: markAllCloudNotificationsRead
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Every unread notification for the current recipient was marked read.
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Session-scoped credential formatted as `Worker <token>`. Every
        authenticated route verifies both the token signature and that its
        worker ID and epoch are still current. Replacing a sandbox therefore
        fences an otherwise unexpired token with `STALE_WORKER_TOKEN`.

        Route scopes are `worker:connect` for heartbeat, `worker:event` for
        events, `worker:turn:claim`, `worker:turn:poll`, and
        `worker:turn:complete` for turn execution,
        `worker:credential:read` for the agent secret, `worker:git` for a
        checkout grant, `worker:orchestrate` for child controls, and
        `worker:transport` for workspace and terminal transport, and
        `worker:notification` for durable agent notification intake.
  parameters:
    ArtifactShareName:
      name: name
      in: query
      required: true
      description: The file name, without a directory.
      schema:
        type: string
        maxLength: 255
    ArtifactShareSHA256:
      name: X-AO-Artifact-SHA256
      in: header
      required: true
      description: Lowercase hex SHA-256 of the body.
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceRepository:
      name: repository
      in: query
      required: false
      description: >-
        Which of the session's repository checkouts the request is about, by
        folder name or GitHub owner/name (see listWorkspaceRepositories).
        Absent means the main repository. Ignored when checking out a branch.
      schema:
        type: string
        maxLength: 201
        pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)?$'
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerTurnAttempt:
      name: attempt
      in: query
      required: true
      description: |
        Positive claim attempt returned with the turn. Together with the epoch
        in the worker token, this fences cancellation checks, output, and the
        terminal turn callback.
      schema:
        type: integer
        minimum: 1
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      description: Return events with a sequence strictly greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        default: 0
    EventTypes:
      name: types
      in: query
      required: false
      description: >-
        Only events of these client event types, comma separated (for example
        types=workspace.setup,workspace.script.step); the parameter may also
        repeat. At most 32 types. A type the control plane does not serve to
        clients matches nothing. Omitted or empty, every client event type is
        served. nextAfter and hasMore follow the filtered events.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Reusing a key with the same command returns the original result.
        Reusing it with a different command returns an IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Error:
      description: Standard Cloud API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The JSON body, path value, query value, or required header is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: The request is syntactically valid but violates a resource constraint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerUnauthorized:
      description: |
        The `Worker` credential is absent, invalid, expired, or belongs to a
        worker epoch that has been replaced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerScopeRequired:
      description: The worker token does not contain the scope required by this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerRoutesDisabled:
      description: Worker routes are not enabled on this deployment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    AgentNotificationEvent:
      type: object
      additionalProperties: false
      required: [eventId, type, occurredAt, payload]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum: [needs_input, agent_failed, agent_completed]
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          maxProperties: 128
    NotificationAcceptance:
      type: object
      additionalProperties: false
      required: [accepted, eventId, duplicate]
      properties:
        accepted:
          type: boolean
          const: true
        eventId:
          type: string
        duplicate:
          type: boolean
    CloudNotification:
      type: object
      additionalProperties: false
      required: [id, orgId, recipientUserId, source, type, title, body, status, metadata, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        source:
          type: string
          const: cloud
        type:
          type: string
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [unread, read]
        eventId:
          type: string
        metadata:
          type: object
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CloudNotificationEvent:
      type: object
      additionalProperties: false
      required: [sequence, orgId, recipientUserId, kind, eventId, notification, createdAt]
      properties:
        sequence:
          type: integer
          format: int64
        orgId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [notification_created, notification_updated, notification_resolved]
        eventId:
          type: string
        notification:
          $ref: "#/components/schemas/CloudNotification"
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, unreadCount, latestSequence]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CloudNotification"
        page:
          type: object
          additionalProperties: false
          required: [hasMore]
          properties:
            hasMore:
              type: boolean
            nextCursor:
              type: string
        unreadCount:
          type: integer
          minimum: 0
        latestSequence:
          type: integer
          format: int64
          minimum: 0
    NotificationEventPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CloudNotificationEvent"
        hasMore:
          type: boolean
    AuthProvider:
      type: string
      enum: [workos, local]
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, authProvider]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrganizationRole"
        offering:
          $ref: "#/components/schemas/Offering"
    PutOrgSandboxProviderInput:
      type: object
      additionalProperties: false
      required: [defaultProvider]
      properties:
        defaultProvider:
          type: string
          description: A provider from the organization's offering, or empty to clear the choice.
    Offering:
      type: object
      additionalProperties: false
      description: >-
        What an organization may use and how it is billed. The control plane is
        the source of truth; clients shape their UI from it and the server
        enforces the same rules on create.
      required: [providers, defaultProvider, billingMode, kind, features]
      properties:
        providers:
          type: array
          description: >-
            Sandbox providers the organization may use: coder and freestyle
            when the deployment offers them, and any other offered provider
            the capability gate allows. Freestyle sessions are billed; Coder
            sessions are billed unless the organization holds the coder
            capability.
          items:
            type: string
        defaultProvider:
          type: string
          description: >-
            Provider a session gets when none is chosen. With more than one
            provider, the organization's own choice (PUT
            /orgs/{orgId}/sandbox-provider) comes first. Then coder for an
            organization with the coder capability, freestyle for everyone
            else, then the deployment default when offered, then the first
            provider, then empty (no cloud sessions). A new project records
            this provider, so changing it later moves no existing project.
        billingMode:
          type: string
          enum: [self_serve, contract, "off"]
          description: >-
            off when the deployment has no Stripe configured or the
            organization is offered no billed provider; self_serve otherwise.
            Billed sandboxes need a plan for every organization, contract,
            internal and grandfathered ones included. contract is no longer
            sent and is kept for older clients.
        kind:
          type: string
          enum: [b2b, b2c, both, none]
          description: >-
            b2b when coder is the only allowed provider, b2c when only other
            providers are allowed, both for a mix, none when no provider is
            allowed.
        features:
          type: array
          description: Plan feature flags; empty when none apply.
          items:
            type: string
        customCoder:
          type: boolean
          description: >-
            The organization may connect its own Coder deployment: it holds the
            coder capability (WorkOS metadata capabilities=coder), or the
            deployment offers coder without gating it. Also true while the
            organization still has a stored connection, so it can inspect or
            clear one. Absent from older control planes.
        artifacts:
          type: boolean
          description: >-
            Whether cloud sessions keep artifact files. When false the
            artifact routes return 404 and requestedOutput "artifact" is
            rejected. Older control planes omit it.
        coderWorkerWorkingFolder:
          type: boolean
          description: >-
            A Coder session whose worker runs as the dedicated ao-worker user
            checks the main repository out in the project's working folder
            (AO_CLOUD_CODER_WORKER_WORKING_FOLDER). When false, a project's
            working folder applies only with the workspace user. Absent from
            older control planes; clients treat absent as false.
    SandboxProviders:
      type: object
      additionalProperties: false
      description: Legacy provider selector data; the same values as offering.providers and offering.defaultProvider.
      required: [available, default]
      properties:
        available:
          type: array
          items:
            type: string
        default:
          type: string
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
        offering:
          # The offering of the first organization, the one the desktop app works in.
          $ref: "#/components/schemas/Offering"
        sandboxProviders:
          $ref: "#/components/schemas/SandboxProviders"
        chatHarnesses:
          type: array
          description: Harnesses a session can start in, or switch to, Chat with.
          items:
            type: string
    AgentCapability:
      type: string
      enum:
        - interface.chat
        - interface.tui
        - model.catalog
        - model.custom
        - attachments
        - browser.preview
        - review.execute
        - session.resume
    AgentInstallationState:
      type: string
      enum: [installed, not_installed, unknown, not_applicable]
    AgentAuthenticationState:
      type: string
      enum: [authorized, unauthorized, unknown, not_applicable]
    AgentOrganizationPolicy:
      type: string
      enum: [not_applicable, allowed, denied]
    AgentAvailability:
      type: object
      additionalProperties: false
      required: [available, installation, authentication, organizationPolicy]
      properties:
        available:
          type: boolean
          description: Effective host readiness after installation, authentication, and organization policy.
        installation:
          $ref: "#/components/schemas/AgentInstallationState"
        authentication:
          $ref: "#/components/schemas/AgentAuthenticationState"
        organizationPolicy:
          $ref: "#/components/schemas/AgentOrganizationPolicy"
        reason:
          type: string
          description: Host-supplied explanation when the agent is unavailable.
    AgentProfile:
      type: object
      additionalProperties: false
      required: [id, label, capabilities, availability]
      properties:
        id:
          type: string
        label:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapability"
        availability:
          $ref: "#/components/schemas/AgentAvailability"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, code, message, requestId]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
    CloudAgentHarness:
      type: string
      enum: [claude-code, codex, cursor, opencode]
    ProjectAgentConfig:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
          maxLength: 500
        mode:
          type: string
          enum: ["", plan, ask]
          description: Cursor CLI mode. Omit or use an empty string for the agent default.
        effort:
          type: string
          enum: ["", low, medium, high, xhigh, max]
          description: Reasoning effort for Codex or Claude Code. Claude Code does not accept xhigh.
        permissions:
          type: string
          enum: ["", default, auto, accept-edits, bypass-permissions]
          description: Native approval policy. OpenCode does not accept accept-edits. Empty uses the session execution policy.
    ProjectRoleConfig:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/CloudAgentHarness"
        agentConfig:
          $ref: "#/components/schemas/ProjectAgentConfig"
    ProjectRoleConfigPatch:
      type: object
      additionalProperties: false
      properties:
        agent:
          $ref: "#/components/schemas/CloudAgentHarness"
        agentConfig:
          $ref: "#/components/schemas/ProjectAgentConfig"
    ProjectReviewer:
      type: object
      additionalProperties: false
      required: [harness]
      properties:
        harness:
          $ref: "#/components/schemas/CloudAgentHarness"
        agentConfig:
          $ref: "#/components/schemas/ProjectAgentConfig"
    ProjectConfig:
      type: object
      additionalProperties: true
      description: Canonical nested role settings. Legacy workerAgent and orchestratorAgent are normalized on reads and removed on the next settings write. Nested agents take precedence.
      properties:
        sessionPrefix:
          type: string
          maxLength: 40
          pattern: '^([A-Za-z0-9_][A-Za-z0-9_-]*)?$'
          description: Prefix for new session branches. Empty uses ao; existing sessions are unchanged.
        worker:
          $ref: "#/components/schemas/ProjectRoleConfig"
        orchestrator:
          $ref: "#/components/schemas/ProjectRoleConfig"
        reviewers:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/ProjectReviewer"
          description: Empty or absent uses the session agent for reviews.
        autoReview:
          type: boolean
          description: Defaults to enabled when absent. Independent of session autoInjectReview feedback delivery.
        coder:
          $ref: "#/components/schemas/ProjectCoderConfig"
        postCreate:
          $ref: "#/components/schemas/ProjectScriptCommands"
        preRemove:
          $ref: "#/components/schemas/ProjectScriptCommands"
        repos:
          $ref: "#/components/schemas/ProjectAdditionalRepositories"
        agentStartsIn:
          $ref: "#/components/schemas/ProjectAgentStartsIn"
        workingDirectory:
          $ref: "#/components/schemas/ProjectWorkingDirectory"
        agentRules:
          $ref: "#/components/schemas/ProjectRules"
        orchestratorRules:
          $ref: "#/components/schemas/ProjectRules"
        source:
          type: string
          description: '"standalone" for a project created without a repository; "scratch" for one whose repository AO created.'
    ProjectAdditionalRepositories:
      type: array
      maxItems: 10
      description: >-
        The project's additional repositories, beside its main repository
        (repositoryUrl). Every session clones each into its own folder beside
        the main checkout, named after the repository, and checks it out on
        the session branch, on every sandbox provider. Each must be a
        github.com repository granted to the organization's GitHub App through
        the same installation as the main one; none may repeat the main
        repository or share a folder name with another. Replaces the legacy
        coder.extraRepos, which is still read when repos is absent. A
        repository whose name starts with a dot is refused. Only organization
        owners and admins may set it.
      items:
        $ref: "#/components/schemas/ProjectRepository"
    ProjectRepository:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: https://github.com/<owner>/<name>; stored canonicalized.
        branch:
          type: string
          maxLength: 255
          description: Branch to clone; empty clones the repository's default branch.
    ProjectAgentStartsIn:
      type: string
      enum: [repository, parent]
      description: >-
        Where the coding agent starts: repository (the default) is the main
        repository's checkout, with access to every other checkout; parent is
        the folder that holds every checkout.
    ProjectWorkingDirectory:
      type: string
      maxLength: 512
      description: >-
        Where sessions work in a bring-your-own Coder workspace when AO runs as
        the workspace user, for example ~/work/{repo}; it overrides the Coder
        connection's working directory. Ignored otherwise.
    ProjectRules:
      type: string
      maxLength: 16384
      description: >-
        Standing instructions added to every session's system prompt
        (agentRules for workers, orchestratorRules for orchestrators). Only
        organization owners and admins may set them, like repos,
        agentStartsIn and workingDirectory.
    ProjectScriptStep:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 4096
        repository:
          type: string
          format: uri
          description: >-
            The project repository the command runs in (its URL, the main
            repository or one of repos); absent runs it in the main
            repository's checkout. Accepted on input only: the project stores
            every step as a plain command, a step in an additional repository
            as "(\ncd -- '../<folder>' || exit 1\n<command>\n)", so releases
            that predate per-repository steps keep and run it.
        timeoutMinutes:
          type: integer
          minimum: 1
          maximum: 120
          description: >-
            The step's own time limit in whole minutes; absent is the default,
            30 for a Setup step and 10 for a Cleanup step. Accepted on input
            only: a step with a limit is stored as a plain command led by the
            shell comment line "# ao-timeout: <N>m", so releases that predate
            per-step limits keep and run it (with their default limit).
    ProjectScriptCommands:
      type: array
      maxItems: 20
      items:
        oneOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - $ref: "#/components/schemas/ProjectScriptStep"
      description: >-
        A project's Setup (postCreate) or Cleanup (preRemove) shell commands,
        the same settings a local project has. Setup commands run in order
        with sh -c in the session's working directory after its checkout and
        before the coding agent starts, once per session, each within its
        time limit (30 minutes unless the step sets timeoutMinutes, 1 to
        120); a failing step keeps the agent from starting until the session
        is reopened. Cleanup commands run in order before the session's
        workspace is deleted (Coder, Freestyle and Docker), best effort, each
        within its time limit (10 minutes unless the step sets
        timeoutMinutes) and the whole run within the sum of them (at least 10
        minutes, at most 2 hours). Both see AO_SESSION_ID, AO_SESSION_KIND,
        AO_SESSION_BRANCH, AO_WORKSPACE_DIR, AO_WORKTREE_PATH,
        AO_SOURCE_TREE_PATH, AO_REPOSITORY_URL, AO_PROJECT_ID and
        AO_PROJECT_NAME. An empty array clears them. A stored step of the form
        "(\ncd -- '../<folder>' || exit 1\n<command>\n)" runs in that
        additional repository's folder, which must be one of the project's
        repositories. A stored step whose first line is "# ao-timeout: <N>m"
        runs with a time limit of N minutes (1 to 120). Only organization
        owners and admins may set them.
    ProjectCoderConfig:
      type: object
      additionalProperties: false
      description: Coder dev-kit settings inherited by every Coder session of the project.
      properties:
        templateId:
          type: string
          format: uuid
          description: Coder template; absent uses the organization or deployment default.
        size:
          type: string
          enum: [small, medium, large]
        startupScript:
          type: string
          maxLength: 65536
        extraRepos:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ProjectCoderRepository"
        workspaceNamePrefix:
          $ref: "#/components/schemas/CoderWorkspaceNamePrefix"
        parameters:
          $ref: "#/components/schemas/CoderTemplateParameterValues"
    CoderTemplateParameterValues:
      type: object
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 4096
      description: >-
        Values for the chosen template's coder_parameter inputs, by parameter
        name. A list(string) value is a JSON array string and a bool is "true"
        or "false". Requires a chosen template; names must be parameters the
        template declares. At workspace create they override the
        organization connection's parameters and are overridden by size and
        startupScript.
    CoderTemplateParameter:
      type: object
      additionalProperties: false
      required: [name, displayName, description, type, formType, mutable, required, defaultValue, options, order]
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        type:
          type: string
          description: 'Coder parameter type: "string", "number", "bool" or "list(string)".'
        formType:
          type: string
          description: Coder's form hint (for example dropdown, multi-select, switch); may be empty.
        mutable:
          type: boolean
          description: False when the value can only be set when a workspace is created.
        required:
          type: boolean
        defaultValue:
          type: string
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, value, description]
            properties:
              name:
                type: string
              value:
                type: string
              description:
                type: string
        order:
          type: integer
        diagnostics:
          type: array
          description: Coder's problems with the parameter's value; only set when evaluated against draft values.
          items:
            type: object
            additionalProperties: false
            required: [severity, summary]
            properties:
              severity:
                type: string
                description: '"error" or "warning".'
              summary:
                type: string
              detail:
                type: string
    OrgCoderConfig:
      type: object
      additionalProperties: false
      required: [baseUrl, owner, templateId, workerUser, reuseExistingCheckout, protectSecretFiles]
      properties:
        baseUrl:
          type: string
        owner:
          type: string
        templateId:
          type: string
        agentName:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        durableRoot:
          type: string
        endpointServiceName:
          type: string
        region:
          type: string
        requireMountedDurableRoot:
          type: boolean
        startupTimeoutSeconds:
          type: integer
        workerUser:
          $ref: "#/components/schemas/CoderWorkerUser"
        readyProbe:
          type: string
          maxLength: 1000
          description: Shell command run as the workspace user after the Coder agent is ready and before AO starts its worker; polled every 5 seconds until it exits 0.
        readyProbeTimeoutSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: Ready check budget, measured from the agent becoming ready. 900 when a ready check is set without one. On timeout the session fails with startup error workspace_setup_not_ready.
        reuseExistingCheckout:
          type: boolean
          description: Work in the checkout of the project repository the template already cloned (under $HOME/work/* or $HOME/*) instead of cloning into ~/repository. Always false for the ao-worker user; defaults to true for the workspace user.
        workingDirectory:
          type: string
          maxLength: 512
          description: >-
            Where sessions work: an absolute path or one starting with ~/ or
            $HOME/, optionally containing {repo} for the repository name (for
            example ~/work/{repo}). An existing checkout of the session
            repository there is adopted, a missing or empty directory gets a
            fresh clone, and anything else fails the checkout. Replaces the
            reuseExistingCheckout search. Requires the workspace worker user.
        protectSecretFiles:
          type: boolean
          description: >-
            Keep Claude Code's file tools (and the file commands it recognizes in
            Bash) from reading or editing .env and .env.* files, except
            .env.example, .env.sample and .env.template. Defaults to true.
            Programs that load .env themselves are unaffected.
    CoderWorkerUser:
      type: string
      enum: [ao-worker, workspace]
      description: >-
        Who runs AO's worker and agent in the workspace: a dedicated ao-worker
        user (default; added to the docker group when one exists), or the
        workspace's own login user with its real HOME, groups and environment.
    OrgCoderConfigResponse:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
        editable:
          type: boolean
          description: >-
            The organization may save a connection (it holds the coder
            capability). False for an organization that may only read and clear
            a stored connection. Absent from older control planes, which only
            answer organizations that may save.
        coderConfig:
          $ref: "#/components/schemas/OrgCoderConfig"
        validationState:
          type: string
        validatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PutOrgCoderConfigInput:
      type: object
      additionalProperties: false
      required: [baseUrl]
      properties:
        token:
          type: string
          description: Coder API token. Required on first save and when baseUrl changes; omit to keep the stored token.
        baseUrl:
          type: string
        owner:
          type: string
          description: Omit to derive from the token.
        templateId:
          type: string
        agentName:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        durableRoot:
          type: string
        endpointServiceName:
          type: string
        region:
          type: string
        requireMountedDurableRoot:
          type: boolean
        startupTimeoutSeconds:
          type: integer
          description: 0 (default 20 minutes) or 60..7200.
        workerUser:
          $ref: "#/components/schemas/CoderWorkerUser"
        readyProbe:
          type: string
          maxLength: 1000
        readyProbeTimeoutSeconds:
          type: integer
          description: 0 (default 900 when readyProbe is set) or 30..3600.
        reuseExistingCheckout:
          type: boolean
          description: Omit for the default (true with the workspace user).
        workingDirectory:
          type: string
          maxLength: 512
          description: >-
            Where sessions work: an absolute path or one starting with ~/ or
            $HOME/, optionally containing {repo} for the repository name (for
            example ~/work/{repo}). An existing checkout of the session
            repository there is adopted, a missing or empty directory gets a
            fresh clone, and anything else fails the checkout. Replaces the
            reuseExistingCheckout search. Requires the workspace worker user.
        protectSecretFiles:
          type: boolean
          description: >-
            Keep Claude Code's file tools (and the file commands it recognizes in
            Bash) from reading or editing .env and .env.* files, except
            .env.example, .env.sample and .env.template. Defaults to true.
            Programs that load .env themselves are unaffected. Omit to keep the stored value (true when never set).
    ProjectCoderRepository:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
        branch:
          type: string
    CoderWorkspaceNamePrefix:
      type: string
      maxLength: 20
      pattern: '^([a-z]([a-z0-9]|-[a-z0-9])*)?$'
      description: >-
        Names new Coder workspaces <prefix>-<short session id> (at most 32
        characters). Lowercase letters, digits and single hyphens, starting with
        a letter and not ending with a hyphen. Empty keeps the default ao-<id>;
        existing sessions keep their workspace.
    ProjectSettingsConfigPatch:
      type: object
      additionalProperties: false
      properties:
        sessionPrefix:
          type: string
          maxLength: 40
          pattern: '^([A-Za-z0-9_][A-Za-z0-9_-]*)?$'
          description: Prefix for new session branches. Empty uses ao; existing sessions are unchanged.
        worker:
          description: Null removes the worker override and uses the session agent selection.
          oneOf:
            - $ref: "#/components/schemas/ProjectRoleConfigPatch"
            - type: "null"
        orchestrator:
          description: Null removes the orchestrator override and uses the session agent selection.
          oneOf:
            - $ref: "#/components/schemas/ProjectRoleConfigPatch"
            - type: "null"
        reviewers:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/ProjectReviewer"
        autoReview:
          type: boolean
        coder:
          type: object
          additionalProperties: false
          description: >-
            Only the workspace name prefix and the template parameters are
            editable after the project is created. parameters replaces the
            stored values as a whole and needs a project with a chosen template.
          properties:
            workspaceNamePrefix:
              $ref: "#/components/schemas/CoderWorkspaceNamePrefix"
            parameters:
              $ref: "#/components/schemas/CoderTemplateParameterValues"
        postCreate:
          $ref: "#/components/schemas/ProjectScriptCommands"
        preRemove:
          $ref: "#/components/schemas/ProjectScriptCommands"
        repos:
          $ref: "#/components/schemas/ProjectAdditionalRepositories"
        agentStartsIn:
          $ref: "#/components/schemas/ProjectAgentStartsIn"
        workingDirectory:
          $ref: "#/components/schemas/ProjectWorkingDirectory"
        agentRules:
          $ref: "#/components/schemas/ProjectRules"
        orchestratorRules:
          $ref: "#/components/schemas/ProjectRules"
    ProjectSettingsInput:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        config:
          $ref: "#/components/schemas/ProjectSettingsConfigPatch"
    CreateStandaloneProjectInput:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        config:
          $ref: "#/components/schemas/ProjectConfig"
    WorkspaceRepositoryList:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRepository"
    WorkspaceRepository:
      type: object
      additionalProperties: false
      required: [name, present]
      properties:
        name:
          type: string
          description: The checkout's folder name, the value ?repository= selects it with. Empty for the main checkout of a single-repository session.
        label:
          type: string
          description: The name to show when it differs from the folder name, such as the main repository's own name.
        repository:
          type: string
          description: The repository's GitHub owner/name, when it is on GitHub.
        branch:
          type: string
          description: Branch an additional repository was cloned from.
        main:
          type: boolean
        present:
          type: boolean
          description: False for an additional repository that could not be cloned.
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
    Project:
      type: object
      additionalProperties: false
      required: [id, orgId, displayName, repositoryUrl, defaultBranch, config, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        displayName:
          type: string
        repositoryUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
        githubRepositoryId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer repository ID encoded as a decimal string to preserve precision.
        standalone:
          type: boolean
          description: True for a project with no repository; its repositoryUrl is a placeholder that is never cloned.
        config:
          $ref: "#/components/schemas/ProjectConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectInput:
      type: object
      additionalProperties: false
      required: [displayName, repositoryUrl, defaultBranch]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        repositoryUrl:
          type: string
          format: uri
          pattern: "^https://"
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        config:
          type: object
          additionalProperties: true
        coder:
          $ref: "#/components/schemas/ProjectCoderConfig"
    UpdateProjectInput:
      type: object
      additionalProperties: false
      required: [displayName, defaultBranch]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
    DeleteProjectResponse:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          type: object
          additionalProperties: false
          required: [id, deleted]
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"
    GitHubInstallationStatus:
      type: string
      enum: [active, suspended, removed]
    GitHubSyncStatus:
      type: string
      enum: [pending, syncing, ready, retry, failed]
    GitHubInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - githubInstallationId
        - accountLogin
        - accountType
        - status
        - repositorySelection
        - syncStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        githubInstallationId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer installation ID encoded as a decimal string to preserve precision.
        accountLogin:
          type: string
        accountType:
          type: string
          enum: [User, Organization, Enterprise]
        status:
          $ref: "#/components/schemas/GitHubInstallationStatus"
        repositorySelection:
          type: string
          enum: [all, selected]
        accessScope:
          type: string
          enum: [installation, user]
          description: >-
