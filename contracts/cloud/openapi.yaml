          type: string
          maxLength: 256
        agentSessionId:
          type: string
          maxLength: 256
    WorkerActivityEventInput:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type:
          type: string
          const: agent.activity
        payload:
          $ref: "#/components/schemas/WorkerActivityPayload"
    WorkerSetupPayload:
      type: object
      additionalProperties: false
      required: [status, exitCode, durationMs]
      properties:
        status:
          type: string
          enum: [succeeded, failed, timed_out]
        step:
          type: integer
          minimum: 0
          description: The 1-based Setup command that failed or timed out; absent on success.
        exitCode:
          type: integer
          description: The failed command's exit status; -1 when it timed out or could not run.
        durationMs:
          type: integer
        output:
          type: string
          description: Redacted tail of the failed (or last) command's combined output, at most 2 KiB.
        command:
          type: string
          description: The failed step's command on one line, redacted and at most 300 bytes, without the cd AO wraps a repository step in.
        repository:
          type: string
          description: The repository folder the failed step ran in; absent for the main repository.
        dir:
          type: string
          description: The directory the failed step ran in.
        user:
          type: string
          description: The Linux user the failed step ran as.
        groups:
          type: array
          items:
            type: string
          description: The Linux groups the failed step ran with.
        logPath:
          type: string
          description: The file in the sandbox that holds the failed step's full output.
        hint:
          type: string
          description: What to change when the output shows the step's user could not do something (Docker, sudo, a path, SSH).
        timeoutMinutes:
          type: integer
          minimum: 1
          maximum: 120
          description: The failed step's time limit in minutes; absent from a worker that predates per-step limits (the step had the Setup default, 30 minutes).
        outputHidden:
          type: boolean
          description: >-
            Set by the control plane, true on the event served to someone
            outside the session's organization (a share-grant holder): output,
            logPath, user, groups, dir and hint are absent.
    WorkerSetupEventInput:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type:
          type: string
          const: workspace.setup
        payload:
          $ref: "#/components/schemas/WorkerSetupPayload"
    ScriptStepPayload:
      type: object
      additionalProperties: false
      required: [phase, runId, step, total, command, repository, status, output, outputTruncated]
      description: >-
        One step of a project's Setup or Cleanup run. The newest event for a
        run's step carries everything needed to show it: a live update repeats
        the step's facts with the latest output tail.
      properties:
        phase:
          type: string
          enum: [setup, cleanup]
        runId:
          type: string
          minLength: 1
          maxLength: 128
          description: The same for every step of one run of the whole list.
        step:
          type: integer
          minimum: 1
          description: 1-based.
        total:
          type: integer
          minimum: 1
          maximum: 1000
          description: Number of steps in the run.
        command:
          type: string
          maxLength: 300
          description: The step's command on one line, redacted and at most 300 bytes, without the cd AO wraps a repository step in. Empty when a Cleanup run's output no longer names it.
        repository:
          type: string
          description: The repository folder the step ran in; empty for the main repository.
        status:
          type: string
          enum: [running, succeeded, failed, timed_out, skipped]
          description: skipped is a step that never ran because an earlier one failed; it is sent once, at the end of the run.
        exitCode:
          type: integer
          description: Set once the step finished (not on running or skipped); -1 when it timed out or could not run.
        startedAt:
          type: string
          format: date-time
          description: When the step started. Absent on a skipped step and on a Cleanup step whose start the output no longer shows.
        durationMs:
          type: integer
          minimum: 0
          description: Set once the step finished, except on a Cleanup step whose start the output no longer shows.
        output:
          type: string
          description: Redacted tail of the step's combined output, at most 16 KiB, without terminal escape sequences. Empty on the running event that starts a step, and when outputHidden.
        outputTruncated:
          type: boolean
          description: True when the output's beginning was dropped.
        outputHidden:
          type: boolean
          description: >-
            Set by the control plane, true on an event served to someone
            outside the session's organization (a share-grant holder): output
            is empty and logPath, user, groups, dir and hint are absent. Only
            the organization's members see a run's output.
        logPath:
          type: string
          description: The file in the sandbox with the full output (for Cleanup, the whole run's).
        user:
          type: string
          description: The Linux user a failed or timed-out step ran as.
        groups:
          type: array
          items:
            type: string
          description: The Linux groups a failed or timed-out step ran with.
        dir:
          type: string
          description: The directory a failed or timed-out step ran in.
        hint:
          type: string
          description: What to change when the output shows the step's user could not do something (Docker, sudo, a path, SSH).
        timeoutMinutes:
          type: integer
          minimum: 1
          maximum: 120
          description: The step's time limit in minutes. Absent when it is not known (a worker or Cleanup hook that predates per-step limits, whose steps had their kind's default, 30 minutes for Setup and 10 for Cleanup).
        outputAt:
          type: string
          format: date-time
          description: >-
            Set by the control plane on a running step's live update: when the
            step last wrote any output, by the control plane's clock (from the
            worker's outputAgeMs). It moves even when the output tail looks the
            same (a repeated line, a progress line redrawn with a carriage
            return): a worker updates a step that keeps writing at least every
            minute. Absent from an older worker; clients then use the event's
            createdAt.
    WorkerScriptStepEventInput:
      type: object
      additionalProperties: false
      required: [type, payload]
      description: A worker reports only Setup steps (phase setup); the control plane reports Cleanup steps itself and refuses a worker's.
      properties:
        type:
          type: string
          const: workspace.script.step
        payload:
          allOf:
            - $ref: "#/components/schemas/ScriptStepPayload"
            - type: object
              properties:
                phase:
                  type: string
                  enum: [setup]
                outputAgeMs:
                  type: integer
                  minimum: 0
                  description: >-
                    On a running step's live update: how many milliseconds
                    before the update the step last wrote any output. The
                    control plane turns it into outputAt with its own clock and
                    does not keep it; an outputAt the worker sends is replaced.
    WorkerWorkspaceStartupPayload:
      type: object
      additionalProperties: false
      required: [status]
      description: >-
        Whether the worker could prepare the session's workspace for its agent
        (repository checkout, the Coder connection's working directory and the
        project's Setup commands) and start the terminal agent a switch to the
        terminal made meanwhile. A failure becomes the session's startup
        error and stays until a later ready report clears it.
      properties:
        status:
          type: string
          enum: [failed, ready]
        code:
          type: string
          enum: [repository_checkout_failed, working_directory_unusable, project_setup_failed, working_directory_occupied, agent_start_failed]
          description: Required when status is failed.
        message:
          type: string
          description: User-facing explanation; required when status is failed.
        detail:
          type: string
          description: Redacted excerpt, for Setup the failed command's output tail.
    WorkerWorkspaceStartupEventInput:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type:
          type: string
          const: workspace.startup
        payload:
          $ref: "#/components/schemas/WorkerWorkspaceStartupPayload"
    WorkerEventInput:
      oneOf:
        - $ref: "#/components/schemas/WorkerActivityEventInput"
        - $ref: "#/components/schemas/WorkerReadyEventInput"
        - $ref: "#/components/schemas/WorkerOutputEventInput"
        - $ref: "#/components/schemas/WorkerSetupEventInput"
        - $ref: "#/components/schemas/WorkerWorkspaceStartupEventInput"
        - $ref: "#/components/schemas/WorkerScriptStepEventInput"
      discriminator:
        propertyName: type
        mapping:
          agent.activity: "#/components/schemas/WorkerActivityEventInput"
          worker.ready: "#/components/schemas/WorkerReadyEventInput"
          chat.assistant_delta: "#/components/schemas/WorkerOutputEventInput"
          workspace.setup: "#/components/schemas/WorkerSetupEventInput"
          workspace.startup: "#/components/schemas/WorkerWorkspaceStartupEventInput"
          workspace.script.step: "#/components/schemas/WorkerScriptStepEventInput"
    WorkerOKResponse:
      type: object
      additionalProperties: false
      required: [ok]
