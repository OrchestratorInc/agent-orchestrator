      properties:
        path:
          type: string
          minLength: 1
        versionId:
          type: string
          minLength: 1
          maxLength: 1024
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 26214400
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mtime:
          type: string
          format: date-time
    WorkerArtifactCommitInput:
      type: object
      additionalProperties: false
      properties:
        files:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/WorkerArtifactCommitFile"
        deleted:
          type: array
          maxItems: 200
          description: Paths this worker previously synced and has since removed.
          items:
            type: string
    SessionStartupError:
      type: object
      additionalProperties: false
      required: [code, message, at]
      description: >-
        The latest user-facing reason the session's sandbox has not started.
        Present until the worker first checks in or the user retries. While
        runtimeState is "terminated" AO has stopped retrying; otherwise it is
        still trying in the background. The worker-reported codes
        repository_checkout_failed, working_directory_unusable,
        working_directory_occupied, project_setup_failed and
        agent_start_failed are the exception: the worker has checked in but
        could not prepare the workspace or start the terminal agent, so the
        agent does not start; they stay until the worker reports the workspace
        ready (or the agent started) after the user retries or reopens the
        session (a workspace checkout request).
      properties:
        code:
          type: string
          description: >-
            Stable reason code: workspace_not_ready, terminal_unavailable,
            unsupported_architecture, durable_root_unavailable,
            worker_never_started, bootstrap_failed,
            workspace_setup_not_ready (a Coder connection's workspace ready
            check never passed), working_directory_not_durable (the project's
            working folder is outside the Coder connection's durable root),
            repository_checkout_failed, working_directory_unusable (also
            reported when the Coder bootstrap cannot prepare the project's
            working folder), working_directory_occupied,
            project_setup_failed or agent_start_failed (the terminal agent
            could not start in the ready workspace), all reported by the
            worker. Clients must tolerate codes added later.
        message:
          type: string
          description: Human-readable explanation suitable for display as-is.
        at:
          type: string
          format: date-time
        detail:
          type: string
          description: >-
            Redacted detail behind the error: operator detail for an
            organization's own (bring-your-own) compute, and the failed
            command's output for project_setup_failed.
    CreateSessionInput:
      type: object
      additionalProperties: false
      required: [projectId, kind, harness, displayName, prompt]
      properties:
        projectId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SessionKind"
        harness:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          maxLength: 65536
        mode:
          $ref: "#/components/schemas/SessionMode"
          default: trusted
        model:
          type: string
          maxLength: 200
          description: >-
            Coding-agent model the session launches with (harness-native id, e.g.
            "anthropic/claude-opus-4-8"). Optional; empty uses the harness default.
        deniedCommands:
          type: array
          items:
            type: string
          default: []
        sandboxProviderConnectionId:
          type: string
          format: uuid
        requestedOutput:
          $ref: "#/components/schemas/RequestedOutput"
        interfaceMode:
          $ref: "#/components/schemas/SessionInterfaceMode"
          description: >-
            Interface the session starts in. Optional; omitted resolves it
            from defaultInterfaceMode, else starts in the terminal (tui). chat
            needs a harness listed in the current account's chatHarnesses,
            else the request is refused with SESSION_MODE_UNSUPPORTED. A
            session that starts in chat queues its prompt as its first turn
            and launches its terminal without it.
        defaultInterfaceMode:
          $ref: "#/components/schemas/SessionInterfaceMode"
          description: >-
            The user's default session interface, for a create without
            interfaceMode. The control plane resolves the session's interface
            from it as the local daemon resolves a spawn: an orchestrator
            starts in chat, a worker in this default, and chat only for a
            harness listed in chatHarnesses (any other starts in tui without
            an error). A create with neither field (from a desktop that
            predates them) starts in tui, an orchestrator too. An
            orchestrator keeps it for the workers it spawns, which resolve
            from the default stored when the orchestrator was created, unlike
            local spawns, which read the user's default at spawn time; a
            changed default reaches them once a new orchestrator is created.
    UpdateSessionPreferencesInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        reviewerHarness:
          oneOf:
            - $ref: "#/components/schemas/CloudReviewerHarness"
            - type: string
              maxLength: 0
        autoReviewEnabled:
          type: boolean
        autoInjectCI:
          type: boolean
        autoInjectReview:
