          description: The stored review was accepted and durably queued for the worker agent.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/preferences:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    patch:
      operationId: updateSessionPreferences
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionPreferencesInput"
      responses:
        "200":
          description: The updated cloud session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviewer-harnesses:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: inspectSessionReviewerHarnesses
      tags: [Reviews]
      responses:
        "200":
          description: Supported reviewer CLI availability inside the live sandbox.
          content:
            application/json:
