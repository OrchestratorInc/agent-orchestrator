name: Package ZIP extraction

on:
  push:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/scripts/package-extraction.node-test.mjs"
      - ".github/workflows/package-extraction.yml"
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/scripts/package-extraction.node-test.mjs"
      - ".github/workflows/package-extraction.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24", "26.11.1"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The extractor ships its native binaries. Skip Electron's download and
      # all other install hooks; this regression needs only ZIP extraction.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/package-extraction.node-test.mjs
