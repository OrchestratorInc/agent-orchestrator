name: Memcode released native role
on:
  pull_request:
    paths:
      - 'backend/internal/adapters/agent/memcode/**'
      - 'test/harness/memcode_released_role.py'
      - '.github/workflows/memcode-released-role.yml'
permissions:
  contents: read
jobs:
  released-role:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official memcode0.38.1
        run: |
          curl --fail --location --retry 2 https://github.com/memcode-ai/memcode/releases/download/v0.38.1/memcode_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/memcode.tar.gz"
          echo '6f06f155922c592f6bbd4f642e0404299772f3fbd6bae335358309604a0bf544  '"$RUNNER_TEMP/memcode.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/memcode-native"
          tar -xzf "$RUNNER_TEMP/memcode.tar.gz" -C "$RUNNER_TEMP/memcode-native"
      - name: Inspect synthetic native provider roles and preserved defaults
        run: python test/harness/memcode_released_role.py "$RUNNER_TEMP/memcode-native/memcode"
