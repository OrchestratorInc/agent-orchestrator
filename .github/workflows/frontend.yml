name: Frontend

# Runs the renderer vitest suite and typechecks the codebase.
#
# The vitest suite is sharded and typechecking runs in its own job so the
# slowest pieces run in parallel; `test` gates on all of them.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/**"
      - "contracts/cloud/**"
      - "packages/cloud-client/**"
      - "packages/product-ui/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac-update-helper:
    # Keep this on Intel to exercise the x64 release target natively while
    # Swift cross-compiles and lipo-verifies the arm64 helper.
    runs-on: macos-26-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test native helper build configuration
        run: node --test scripts/build-update-helper.node-test.mjs
      - name: Test wake helper build configuration
        run: node --test scripts/build-wake-helper.node-test.mjs
      - name: Compile and test wake helper
        run: |
          node scripts/build-wake-helper.mjs --arch x64
          lipo wake-helper/ao-wake -verify_arch x86_64
          node scripts/build-wake-helper.mjs --arch arm64
          lipo wake-helper/ao-wake -verify_arch arm64
          mkdir -p "$HOME/.ao/build-cache/wake-helper/tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/wake-helper/tests" native/wake-helper/WakePolicy.swift native/wake-helper/PolicyTests.swift -o "$HOME/.ao/build-cache/wake-helper/policy-tests"
          "$HOME/.ao/build-cache/wake-helper/policy-tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/wake-helper/tests" native/wake-helper/WakePolicy.swift native/wake-helper/WakeLights.swift native/wake-helper/WakeEffects.swift native/wake-helper/EffectsTests.swift -o "$HOME/.ao/build-cache/wake-helper/effects-tests"
          "$HOME/.ao/build-cache/wake-helper/effects-tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/wake-helper/tests" native/wake-helper/WakePolicy.swift native/wake-helper/WakeLowPower.swift native/wake-helper/LowPowerTests.swift -o "$HOME/.ao/build-cache/wake-helper/low-power-tests"
          "$HOME/.ao/build-cache/wake-helper/low-power-tests"
      - name: Test repair installer packaging and guards
        run: node --test scripts/build-mac-repair-installer.node-test.mjs
      - name: Compile helper for both macOS architectures
        run: |
          node scripts/build-update-helper.mjs --arch x64
          lipo update-helper/ao-update-progress -verify_arch x86_64
          node scripts/build-update-helper.mjs --arch arm64
          lipo update-helper/ao-update-progress -verify_arch arm64
      - name: Run native update state tests
        run: |
          mkdir -p "$HOME/.ao/build-cache/update-helper/tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/update-helper/tests" native/update-helper/UpdateProgressState.swift native/update-helper/StateTests.swift -o "$HOME/.ao/build-cache/update-helper/state-tests"
          "$HOME/.ao/build-cache/update-helper/state-tests"

  mac-dmg-layout:
    # The macOS install window. Builds a real dmg with scripts/build-mac-dmg.mjs
    # (the builder the release conductor runs on the stapled app), mounts it
    # read-only and asserts the .DS_Store, background and icon positions are
    # there. The control proves the check still catches what shipped through
    # v0.14.7: a bare `hdiutil create -srcfolder` image with no layout at all.
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        # Only app-builder-lib (pure JS) is needed; skip Electron's download.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check a dmg around a fixture app
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dmg-layout"
          app="$work/Agent Orchestrator.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp assets/icon.icns "$app/Contents/Resources/icon.icns"
          printf '#!/bin/sh\n' > "$app/Contents/MacOS/agent-orchestrator"
          chmod +x "$app/Contents/MacOS/agent-orchestrator"
          plutil -create xml1 "$app/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string agent-orchestrator "$app/Contents/Info.plist"
          plutil -insert CFBundleIconFile -string icon.icns "$app/Contents/Info.plist"
          plutil -insert CFBundlePackageType -string APPL "$app/Contents/Info.plist"
          # Builds, then runs --check itself and exits non-zero on any problem.
          node scripts/build-mac-dmg.mjs --app "$app" --arch arm64 --output "$work/agent-orchestrator-darwin-arm64.dmg"
          test ! -e "$work/agent-orchestrator-darwin-arm64.dmg.blockmap"
          node scripts/build-mac-dmg.mjs --check "$work/agent-orchestrator-darwin-arm64.dmg"

          stage="$work/bare"
          mkdir -p "$stage"
          ditto "$app" "$stage/Agent Orchestrator.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Agent Orchestrator" -srcfolder "$stage" -ov -format UDZO "$work/bare.dmg"
          if node scripts/build-mac-dmg.mjs --check "$work/bare.dmg"; then
            echo "::error::the layout check accepted a dmg with no layout"
            exit 1
          fi
          # Nothing may stay mounted after either check.
          ! hdiutil info | grep -q ao-dmg-check

  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the source-build runtime in bootstrap-self-hosted.sh.
          node-version: 22.23.2
      - name: Check self-hosted npm lockfile compatibility
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/src/docs/package-lock.json
            packages/cloud-client/package-lock.json
            packages/product-ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      - name: Install Cloud client dependencies
        run: npm ci
        working-directory: packages/cloud-client

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Verify Cloud contract and client
        run: |
          npm run generate
          git diff --exit-code -- src/schema.ts
          npm run typecheck
          npm test
          npm pack --dry-run
        working-directory: packages/cloud-client

      - name: Verify product UI package
        run: |
          npm run typecheck
          npm test
          npm pack --dry-run
        working-directory: packages/product-ui

      - name: Prepare pinned agent-browser runtime
        run: npm run browser-runtime:prepare -- --quiet

      - name: Install docs dependencies
        run: npm ci --prefix src/docs

      # Re-extracts the docs catalogs, then fails if any locale is missing a
      # translation for a string in the source.
      - name: Check docs translations
        run: npm run check:i18n --prefix src/docs

      - name: Test docs
        run: npm test --prefix src/docs

      - name: Build docs
        run: npm run build --prefix src/docs

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify terminal origin boundary in real Electron
        working-directory: backend
        run: |
          # Keep lazy-download output out of the executable-path capture.
          node ../frontend/node_modules/electron/install.js
          AO_MUX_ELECTRON="$(node -p "require('../frontend/node_modules/electron')")" xvfb-run -a go test -count=1 -run '^TestMuxOriginElectron$' ./internal/httpd

      - name: Verify daemon browser boundary in real Electron
        working-directory: backend
        run: |
          AO_BOUNDARY_ELECTRON="$(node -p "require('../frontend/node_modules/electron')")" xvfb-run -a go test -count=1 -run '^TestBrowserBoundaryElectron$' ./internal/httpd

      - name: Verify mobile control boundary in real Electron
        working-directory: backend
        run: |
          # Install first so lazy-download output cannot become part of the executable path.
          node ../frontend/node_modules/electron/install.js
          electron_binary="$(node -p "require('../frontend/node_modules/electron')")"
          test -x "$electron_binary"
          AO_MOBILE_CONTROL_ELECTRON="$electron_binary" xvfb-run -a go test -count=1 -run '^TestMobileControlOriginElectron$' ./internal/httpd

      - name: Run guarded-navigation browser integration
        run: npm run test:browser-postcondition-integration

  typecheck:
    runs-on: ubuntu-latest
    env:
      # tsc needs Electron's types, not its binary; skip the flaky download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      # tsconfig maps @aoagents/product-ui to its source, whose imports resolve
      # from packages/product-ui/node_modules.
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Typecheck project
        run: npm run typecheck

      - name: Typecheck E2E suite
        run: npm run typecheck:e2e

  vitest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Prepare pinned agent-browser runtime
        run: npm run browser-runtime:prepare -- --quiet

      - name: Run vitest shard
        env:
          AO_AGENT_BROWSER_TEST_BINARY: ${{ github.workspace }}/frontend/agent-browser/agent-browser
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # Keep the existing check name as the gate for the split frontend jobs.
  test:
    if: always()
    needs: [checks, typecheck, vitest, mac-dmg-layout]
    runs-on: ubuntu-latest
    steps:
      - name: Check frontend results
        run: |
          test '${{ needs.mac-dmg-layout.result }}' = success
          test '${{ needs.checks.result }}' = success
          test '${{ needs.typecheck.result }}' = success
          test '${{ needs.vitest.result }}' = success

  renderer-smoke:
    # RENDERER smoke (issue #2483, renderer slice) — the Playwright specs that run
    # the renderer under `dev:web` with an injected window.ao + fake CDC/snapshot.
    # This is fast renderer-regression coverage; it is NOT the canonical T0/P0
    # end-to-end gate. Real daemon/storage/API/preload/PTY/FS boundaries are
    # exercised by the packaged-app pod gate (#2697), not here.
    # playwright.config starts `dev:web` itself (webServer); the pinned container
    # provides Chromium and its system dependencies without a live apt install.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep this aligned with Playwright in frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The performance fixture imports real renderer components, which in turn
      # typecheck product-ui source through the frontend's TS path alias.
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Typecheck e2e suite
        # Playwright transpiles specs without typechecking, so the
        # `satisfies AoBridge` guard in e2e/support/fake-bridge.ts (the
        # preload-drift tripwire) is only enforced by this step.
        run: npm run typecheck:e2e

      - name: Run renderer smoke suite
        run: CI=true npm run test:e2e:renderer
