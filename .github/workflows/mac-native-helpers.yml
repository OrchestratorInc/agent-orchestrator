name: macOS native helpers

# Builds and tests the Swift update and wake helpers and the repair installer.
# macOS runners are the most expensive in CI, so this runs only when those
# helpers or their build scripts change.

on:
  push:
    branches: [main]
    paths:
      - "frontend/native/**"
      - "frontend/scripts/build-update-helper*"
      - "frontend/scripts/build-wake-helper*"
      - "frontend/scripts/build-mac-repair-installer*"
      - ".github/workflows/mac-native-helpers.yml"
  pull_request:
    paths:
      - "frontend/native/**"
      - "frontend/scripts/build-update-helper*"
      - "frontend/scripts/build-wake-helper*"
      - "frontend/scripts/build-mac-repair-installer*"
      - ".github/workflows/mac-native-helpers.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac-update-helper:
    # Keep this on Intel to exercise the x64 release target natively while
    # Swift cross-compiles and lipo-verifies the arm64 helper.
    runs-on: macos-26-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test native helper build configuration
        run: node --test scripts/build-update-helper.node-test.mjs
      - name: Test wake helper build configuration
        run: node --test scripts/build-wake-helper.node-test.mjs
      - name: Compile and test wake helper
        run: |
          node scripts/build-wake-helper.mjs --arch x64
          lipo wake-helper/ao-wake -verify_arch x86_64
          node scripts/build-wake-helper.mjs --arch arm64
          lipo wake-helper/ao-wake -verify_arch arm64
          mkdir -p "$HOME/.ao/build-cache/wake-helper/tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/wake-helper/tests" native/wake-helper/WakePolicy.swift native/wake-helper/PolicyTests.swift -o "$HOME/.ao/build-cache/wake-helper/policy-tests"
          "$HOME/.ao/build-cache/wake-helper/policy-tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/wake-helper/tests" native/wake-helper/WakePolicy.swift native/wake-helper/WakeLights.swift native/wake-helper/WakeEffects.swift native/wake-helper/EffectsTests.swift -o "$HOME/.ao/build-cache/wake-helper/effects-tests"
          "$HOME/.ao/build-cache/wake-helper/effects-tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/wake-helper/tests" native/wake-helper/WakePolicy.swift native/wake-helper/WakeLowPower.swift native/wake-helper/LowPowerTests.swift -o "$HOME/.ao/build-cache/wake-helper/low-power-tests"
          "$HOME/.ao/build-cache/wake-helper/low-power-tests"
      - name: Test repair installer packaging and guards
        run: node --test scripts/build-mac-repair-installer.node-test.mjs
      - name: Compile helper for both macOS architectures
        run: |
          node scripts/build-update-helper.mjs --arch x64
          lipo update-helper/ao-update-progress -verify_arch x86_64
          node scripts/build-update-helper.mjs --arch arm64
          lipo update-helper/ao-update-progress -verify_arch arm64
      - name: Run native update state tests
        run: |
          mkdir -p "$HOME/.ao/build-cache/update-helper/tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/update-helper/tests" native/update-helper/UpdateProgressState.swift native/update-helper/StateTests.swift -o "$HOME/.ao/build-cache/update-helper/state-tests"
          "$HOME/.ao/build-cache/update-helper/state-tests"
