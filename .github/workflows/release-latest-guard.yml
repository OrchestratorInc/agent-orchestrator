name: Release latest guard

# Guard against accidental non-stable GitHub releases taking over
# /releases/latest and breaking electron-updater's stable channel.
on:
  release:
    types: [published, edited, released]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  latest-release:
    # Stable /releases/latest only exists on the canonical repo. Forks copy
    # this workflow (including the hourly schedule) but have no desktop
    # release, so the check fails red every hour.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /README.md
            /translations/
            /frontend/src/docs/src/components/mdx.tsx
          sparse-checkout-cone-mode: false

      - name: Verify latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh release view --repo "$REPO" --json tagName,isPrerelease,isDraft,assets)"
          tag="$(jq -r '.tagName' <<<"$release_json")"
          prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          draft="$(jq -r '.isDraft' <<<"$release_json")"

          echo "Latest release: $tag"

          if [[ "$draft" == "true" || "$prerelease" == "true" ]]; then
            echo "::error::GitHub latest resolved to draft/prerelease '$tag'; stable latest must be a published non-prerelease."
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GitHub latest resolved to '$tag'; expected a stable semver tag like v0.10.2."
            exit 1
          fi

          mapfile -t assets < <(jq -r '.assets[].name' <<<"$release_json")
          printf 'Assets:\n%s\n' "${assets[@]}"

          # The release conductor names the assets, so a rename there can leave
          # the published download links pointing at nothing (#7726).
          if ! linked_assets="$(grep -ohE '[A-Za-z][A-Za-z-]*-(darwin|win32|linux)-(arm64|x64)\.(dmg|zip|exe|AppImage|deb|rpm)' \
            README.md translations/README.*.md frontend/src/docs/src/components/mdx.tsx | sort -u)"; then
            echo "::error::Could not read linked assets: a source file is missing or no longer matches the guard pattern."
            exit 1
          fi
          mapfile -t linked_assets <<<"$linked_assets"

          required_assets=(
            latest.yml
            latest-mac.yml
            latest-linux.yml
            "${linked_assets[@]}"
          )

          for required in "${required_assets[@]}"; do
            if ! printf '%s\n' "${assets[@]}" | grep -Fxq "$required"; then
              echo "::error::Latest stable release '$tag' is missing asset '$required'."
              exit 1
            fi
          done

  package-version:
    # frontend/package.json's version feeds CFBundleShortVersionString and the
    # in-app Settings -> Updates display, so main must not fall behind the
    # latest stable tag (see #4467).
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: frontend/package.json
          sparse-checkout-cone-mode: false

      - name: Verify frontend/package.json tracks latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$(gh release view --repo "$REPO" --json tagName -q '.tagName')"
          release_version="${tag#v}"
          package_version="$(jq -r '.version' frontend/package.json)"

          echo "Latest stable release: $release_version"
          echo "frontend/package.json on main: $package_version"

          lowest="$(printf '%s\n%s\n' "$release_version" "$package_version" | sort -V | head -n1)"
          if [[ "$lowest" != "$release_version" ]]; then
            echo "::error::frontend/package.json version '$package_version' on main is behind latest stable release '$release_version'. Bump it so the desktop app reports the shipped version."
            exit 1
          fi
