name: Intel Node JIT

# TEMPORARY: remove before merge.
# Reproduces #6621 on real Intel hardware: a Node signed with the hardened
# runtime but without allow-unsigned-executable-memory crashes when V8 compiles
# JavaScript, and the daemon must re-sign a working copy. Linux and Apple
# Silicon cannot reproduce the crash, so this runs only on an Intel runner and
# only when the code involved changes.

on:
  pull_request:
    paths:
      - "backend/internal/adapters/chatdriver/claudeacp/**"
      - ".github/workflows/intel-node-jit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intel-node-jit:
    # macOS 26 Intel does not enforce the entitlement; the reports are on 15.
    runs-on: macos-15-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the runner is Intel
        run: test "$(uname -m)" = x86_64
      - name: Reproduce the crash and the repair with a re-signed stock Node
        continue-on-error: true
        env:
          AO_REQUIRE_NODE_JIT_REPRO: "1"
        run: go test -count=1 -v -run 'TestJITCapableNode' ./internal/adapters/chatdriver/claudeacp/
      - name: Download the published 0.14.8 Intel app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ao-0148"
          gh release download v0.14.8 --repo "$GITHUB_REPOSITORY" --pattern agent-orchestrator-darwin-x64.zip --dir "$RUNNER_TEMP/ao-0148"
          ditto -x -k "$RUNNER_TEMP/ao-0148/agent-orchestrator-darwin-x64.zip" "$RUNNER_TEMP/ao-0148/app"
          NODE_BIN="$(find "$RUNNER_TEMP/ao-0148/app" -path '*/Contents/Resources/acp-runtime/node/bin/node' | head -1)"
          test -n "$NODE_BIN"
          echo "NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"
          codesign -d --entitlements - "$NODE_BIN" || true
          sw_vers; sysctl -n machdep.cpu.brand_string
          set +e
          "$NODE_BIN" -e 'let s=0;for(let i=0;i<1e8;i++)s+=i;console.log("ok")'
          echo "bundled node exit=$?"
      - name: Reproduce the crash and the repair with the shipped Node
        env:
          AO_REQUIRE_NODE_JIT_REPRO: "1"
          AO_TEST_BROKEN_NODE: ${{ env.NODE_BIN }}
        run: go test -count=1 -v -run 'TestJITCapableNodeRepairsRealIntelNode' ./internal/adapters/chatdriver/claudeacp/
