name: Go

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "pricing/**"
      - "frontend/src/api/schema.ts"
      - "package.json"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launcher-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check launcher-related paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- \
            backend/internal/adapters/agent/binaryutil/ \
            backend/internal/adapters/agent/modelcatalog/ \
            backend/internal/adapters/agent/cursor/ \
            backend/internal/adapters/agent/claudecode/ \
            backend/internal/service/systeminstall/ \
            backend/go.mod backend/go.sum .github/workflows/go.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  backend-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI can't drift from the module
          # (it previously pinned 1.22 while go.mod declared 1.25).
          go-version-file: backend/go.mod
          # Restore the module and build caches. `go test -race ./...` rebuilds
          # every dependency with race instrumentation, and modernc.org/sqlite
          # alone is minutes of that on a 4-vCPU runner: the SQLite package did
          # not start until ~5 minutes into a 20-minute Test step. The cache is
          # keyed on go.sum, so a dependency bump still gets a cold, correct
          # build.
          cache-dependency-path: backend/go.sum

      - name: Install Cue test shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish

      - name: Check formatting
        if: matrix.shard == 0
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        if: matrix.shard == 0
        run: go build ./...

      - name: Vet
        if: matrix.shard == 0
        run: go vet ./...

      - name: Test
        env:
          skip_global_compinit: "1"
        # -count=1 disables Go's test-result cache. The build cache restored
        # above also carries test results between runs, and without this a run
        # reported 158 of 170 packages as (cached) without executing them. The
        # cache is content-aware for Go inputs but not for the things these
        # tests actually touch — subprocesses, PATH contents, the network — so
        # a required check must still run every test. Compilation stays cached.
        run: |
          packages=$(go list ./... | grep -v -e '/internal/storage/sqlite$' -e '/internal/service/chat$' -e '/internal/session_manager$' -e '/internal/storage/sqlite/store$')
          selected=$(printf '%s\n' "$packages" | awk -v shard=${{ matrix.shard }} '((NR - 1) % 2) == shard')
          test -n "$selected"
          printf '%s\n' "$selected" | xargs go test -race -count=1 -timeout=20m

  chat-race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test chat
        run: |
          tests=$(go test -race -list . ./internal/service/chat | grep -E '^(Test|Example|Fuzz)')
          selected=$(printf '%s\n' "$tests" | awk -v shard=${{ matrix.shard }} '((NR - 1) % 2) == shard' | paste -sd '|' -)
          test -n "$selected"
          go test -race -count=1 -timeout=20m -run "^($selected)$" ./internal/service/chat

  session-store-race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test session manager and SQLite store
        run: go test -race -count=1 -timeout=20m ./internal/session_manager ./internal/storage/sqlite/store

  sqlite-race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test SQLite shard
        run: |
          tests=$(go test -race -list . ./internal/storage/sqlite | grep -E '^(Test|Example|Fuzz)')
          selected=$(printf '%s\n' "$tests" | awk -v shard=${{ matrix.shard }} '((NR - 1) % 4) == shard' | paste -sd '|' -)
          test -n "$selected"
          go test -race -count=1 -timeout=20m -run "^($selected)$" ./internal/storage/sqlite

  # Keep the existing required check as the gate for every backend race test.
  build-test:
    if: always()
    needs: [backend-core, chat-race, session-store-race, sqlite-race, launcher-changes, launcher-identity]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend results
        run: |
          test '${{ needs.backend-core.result }}' = success
          test '${{ needs.chat-race.result }}' = success
          test '${{ needs.session-store-race.result }}' = success
          test '${{ needs.sqlite-race.result }}' = success
          test '${{ needs.launcher-changes.result }}' = success
          if [ '${{ needs.launcher-changes.outputs.run }}' = true ]; then
            test '${{ needs.launcher-identity.result }}' = success
          else
            test '${{ needs.launcher-identity.result }}' = skipped
          fi

  launcher-identity:
    name: launcher-identity (${{ matrix.os }})
    needs: launcher-changes
    if: needs.launcher-changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install real agent packages into isolated prefixes
        shell: pwsh
        run: |
          $lab = Join-Path $env:RUNNER_TEMP 'ao-launcher-identity'
          $env:BUN_INSTALL = Join-Path $lab 'bun'
          $env:BUN_INSTALL_CACHE_DIR = Join-Path $lab 'bun-cache'
          npm install --global --prefix "$lab/npm" --ignore-scripts --no-audit --no-fund @kilocode/cli@7.8.17 @mimo-ai/cli@0.1.15 @factory/cli@0.249.0 @oh-my-pi/pi-coding-agent@18.12.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun add --global --ignore-scripts @oh-my-pi/pi-coding-agent@18.12.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AO_TEST_NPM_PREFIX=$lab/npm" >> $env:GITHUB_ENV
          "AO_TEST_BUN_ROOT=$lab/bun" >> $env:GITHUB_ENV
      - name: Install pinned native POSIX version managers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          managers="$RUNNER_TEMP/ao-launcher-identity/managers"
          mkdir -p "$managers/asdf/bin"
          GOBIN="$managers/asdf/bin" go install github.com/asdf-vm/asdf/cmd/asdf@v0.16.0
          git clone --quiet https://github.com/pyenv/pyenv.git "$managers/pyenv"
          git -C "$managers/pyenv" checkout --quiet --detach 0effba62c4bbf8f8ca2ad8f0eabbfd8221cc7bc6
          git clone --quiet https://github.com/nodenv/nodenv.git "$managers/nodenv"
          git -C "$managers/nodenv" checkout --quiet --detach 093570626794abb172ad3a3a897efb4fca3f5b93
          echo "AO_TEST_MANAGERS_ROOT=$managers" >> "$GITHUB_ENV"
      - name: Test real package layouts and generated manager shims
        working-directory: backend
        run: go test -race -count=1 -timeout=10m -v -run '^TestDiscoveryExecutable' ./internal/adapters/agent/binaryutil/
      - name: Test update version-probe rejection and model/auth boundaries
        working-directory: backend
        shell: pwsh
        run: |
          go test -race -count=1 -run '^TestVerifier' ./internal/service/systeminstall/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 -run '^TestDiscovery|^TestKiroDiscovery' ./internal/adapters/agent/modelcatalog/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 -run '^TestCursorCLIAuth|^TestCursorAuthRejects' ./internal/adapters/agent/cursor/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 -run '^TestClaudeAuthCommandRejectsRedirect$' ./internal/adapters/agent/claudecode/

  # The suite above only ever runs on Linux, so the packages whose behaviour is
  # genuinely platform-specific have never been exercised on Windows: worktree
  # teardown renames and unlinks directories, and Windows is the platform where
  # an open handle makes both fail. Scoped to those packages rather than the
  # whole suite to keep the matrix cheap.
  windows-workspace:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Scoped to teardown and kill by name rather than running these packages
      # whole: running them on Windows for the first time surfaced ten
      # pre-existing failures (agent switching, handoff artifacts, spawn PATH
      # and branch namespacing) that have nothing to do with worktree teardown.
      # Widening this is worth doing, but as its own change with its own fixes.
      - name: Test SQLite filesystem path identity
        run: go test -race -count=1 -run 'Test(OpenPreservesDataDirectoryCharacters|FragmentPathsKeepDatabasesIsolated|OpenRefusesToHideLegacyDatabase|OpenPrefersExistingIntendedDatabase|DatabaseURIPreservesWindowsPaths)$' ./internal/storage/sqlite

      - name: Test data-dir lock (LockFileEx)
        run: go test -race -count=1 ./internal/datadirlock/

      - name: Test workspace teardown and session kill
        run: go test -race -count=1 -v -run 'Destroy|Discard|Sweep|Kill|RunPostCreate|TaskNaming|RenameTaskBranch' ./internal/adapters/workspace/... ./internal/session_manager/

      - name: Test Windows Chat environment precedence
        run: go test -race -count=1 ./internal/adapters/chatdriver/processenv/ ./internal/agentlaunch/

      - name: Test Windows Cue shell readiness and command delivery
        run: go test -race -count=1 -timeout=10m -run '^TestCue' ./internal/service/shellterm

      - name: Test Windows Chat provider process cleanup
        run: go test -race -count=1 -run '^(TestWindowsProviderJobReapsGrandchild|TestWindowsHostDescriptorReadAndRemovalDoNotBlockEachOther|TestWindowsHostDescriptorReadsPastMaxPath|TestExtendedLengthPathMatchesOS)$' ./internal/adapters/chatdriver/persistenthost/

      - name: Test Windows Chat hibernate and native resume
        run: go test -race -count=1 -run '^(TestPersistentClaudeACPHibernateAndNativeResume|TestCodexHibernateStopsAppServerAndNativeResumesThread)$' ./internal/adapters/chatdriver/acp/ ./internal/adapters/chatdriver/codexappserver/

      - name: Test Windows background agent commands have no console
        run: go test -race -count=1 -run '^TestBackgroundCommandHasNoConsole$' ./internal/adapters/agent/pi ./internal/adapters/agent/omp ./internal/adapters/agent/primeagent
      - name: Test Windows subprocess commands
        run: go test -race -count=1 -run 'Cloudflared|Tunnel|Command' ./internal/mobilebridge/ ./internal/process/ ./internal/adapters/systemexec/

      - name: Test Windows PowerShell installers
        run: go test -race -count=1 -v -run '^TestRunInstallScriptPowerShell' ./internal/adapters/systemexec/

      - name: Test native Goose identity
        run: go test -race -count=1 -timeout=10m ./internal/adapters/agent/binaryutil ./internal/adapters/agent/goose

      - name: Test OpenCode Windows npm shim version probe
        run: go test -race -count=1 -run '^TestResolveBinaryForMajorAcceptsSlowShim$' ./internal/adapters/agent/opencode

      - name: Test Goose readiness and inventory
        run: go test -race -count=1 -timeout=10m -run '^Test(FindInstalledBinary|WarmReadinessAndFindInstalled|PresslyGoose|Refresh|Probe|ReadinessCoordinator)' ./internal/service/agent

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: golangci-lint
        # v8 of the action drives golangci-lint v2 (the schema this config uses);
        # the v6 action speaks v1 CLI flags and errors against a v2 binary.
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned for reproducibility: bump intentionally rather than letting an
          # upstream release change CI. Must be built with Go >= the module's
          # (go.mod is 1.27); v2.13.2 is built with go1.27 — older v2 tags
          # (e.g. v2.1.x) are built with go1.24 and refuse to analyze 1.27 code.
          version: v2.13.2
          working-directory: backend
          # Blocking on the full ruleset: the tree is clean at zero findings, so
          # any new issue fails CI rather than being grandfathered.

  sqlc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate storage queries with pinned sqlc
        run: npm run sqlc

      - name: Check for generated storage drift
        run: |
          git diff --exit-code -- backend/internal/storage/sqlite/gen
          test -z "$(git ls-files --others --exclude-standard -- backend/internal/storage/sqlite/gen)"

  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API spec and TS types
        run: npm run api

      # openapi.yaml drift is already caught by TestBuild_MatchesEmbedded in
      # the build-test job (go test -race ./...). Only schema.ts needs checking here.
      - name: Check for schema.ts drift
        run: git diff --exit-code -- frontend/src/api/schema.ts
