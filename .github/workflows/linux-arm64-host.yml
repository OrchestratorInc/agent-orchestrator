name: Linux arm64 host package

# There is no arm64 Linux desktop app, so arm64 hosts install this headless
# package (daemon, Node ACP runtime, tmux) with setup-self-hosted.sh. Pull
# requests that touch its inputs build it too, so a break shows before a release.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
  pull_request:
    paths:
      - ".github/workflows/linux-arm64-host.yml"
      - "backend/**"
      - "!backend/**/*_test.go"
      - "frontend/package.json"
      - "frontend/acp-runtime/**"
      - "frontend/scripts/build-acp-runtime*.mjs"
      - "frontend/scripts/build-daemon.mjs"
      - "frontend/scripts/build-host-bundle.mjs"
      - "frontend/scripts/build-tmux.mjs"
      - "frontend/scripts/go-version.mjs"
      - "frontend/scripts/tmux-version.mjs"
      - "scripts/bootstrap-self-hosted.sh"
      - "scripts/setup-self-hosted.sh"

permissions:
  contents: read

# run_id keeps release builds out of the cancel group; only PR runs share one.
concurrency:
  group: linux-arm64-host-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux-arm64 host package
    # Native, not cross-built: tmux compiles from source and Node is per-arch.
    # 22.04 matches the x64 build's glibc baseline.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    env:
      # build-daemon.mjs bakes it in, so `ao remote-host link` signs in with the
      # desktop's WorkOS client.
      VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify WorkOS build configuration
        if: inputs.version != ''
        run: |
          if [ -z "$VITE_WORKOS_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_WORKOS_CLIENT_ID is required for release artifacts." >&2
            exit 1
          fi
      - name: Stamp version
        if: inputs.version != ''
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          node -e "const v=process.env.BUILD_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file pkg-config
      # No frontend `npm ci`: these scripts need only Node built-ins.
      - name: Build host package
        run: |
          npm run build:daemon
          npm run build:tmux
          npm run build:acp-runtime
          npm run build:host
      - name: Smoke-test host package
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/host-check"
          mkdir -p "$check"
          tar -xzf dist-host/ao-host-linux-arm64.tar.gz -C "$check"
          resources="$check/resources"
          info="$(file "$resources/daemon/ao")"
          echo "$info"
          [[ "$info" == *"ARM aarch64"* ]] || { echo "::error::daemon is not an arm64 binary" >&2; exit 1; }
          expected="$(node -p "require('./package.json').version")"
          actual="$("$resources/daemon/ao" version | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::ao version reports $actual, expected $expected" >&2
            exit 1
          fi
          "$resources/daemon/ao" remote-host --help >/dev/null
          "$resources/acp-runtime/node/bin/node" --version
          "$resources/tmux/bin/tmux" -V
      # glibc 2.34, the package's floor. PR runs only: a slow mirror must not hold up a release.
      - name: Install on Amazon Linux 2023
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          script="$(cat <<'SH'
          # The minimal image lacks tools every Amazon Linux 2023 VM has.
          dnf install -y -q sudo shadow-utils gzip findutils gawk procps-ng
          useradd -m ao
          echo 'ao ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ao
          # No systemd here: with loginctl stubbed, the bootstrap must stop at its user session check.
          printf '#!/bin/sh\nexit 0\n' > /usr/bin/loginctl
          chmod 755 /usr/bin/loginctl
          if sudo -iu ao bash /src/scripts/bootstrap-self-hosted.sh > /tmp/bootstrap.out 2>&1; then
            cat /tmp/bootstrap.out; echo 'bootstrap succeeded without systemd' >&2; exit 1
          fi
          tail -n 5 /tmp/bootstrap.out
          grep -q 'A systemd user session is required' /tmp/bootstrap.out || { cat /tmp/bootstrap.out >&2; exit 1; }
          sudo -iu ao bash -c 'gh --version && git --version && python3 --version'
          sudo -iu ao bash /src/scripts/setup-self-hosted.sh --bundle /src/frontend/dist-host/ao-host-linux-arm64.tar.gz --install-only
          cat > /tmp/check.sh <<'CHECK'
          set -euo pipefail
          resources="$HOME/.ao/host/current/resources"
          ~/.local/bin/ao version
          "$resources/acp-runtime/node/bin/node" --version
          tmux="$resources/tmux/bin/tmux"
          "$tmux" -S /tmp/smoke.sock -f /dev/null new-session -d -s smoke 'sleep 30'
          "$tmux" -S /tmp/smoke.sock has-session -t smoke
          "$tmux" -S /tmp/smoke.sock kill-server
          ~/.local/bin/ao daemon > /tmp/daemon.log 2>&1 &
          ready() { ~/.local/bin/ao status --json | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("state") != "ready")'; }
          for _ in $(seq 60); do ready && break; sleep 1; done
          ready || { cat /tmp/daemon.log; exit 1; }
          ~/.local/bin/ao stop
          CHECK
          chmod 755 /tmp/check.sh
          sudo -iu ao bash /tmp/check.sh
          SH
          )"
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -euo pipefail -c "$script"
      - name: Collect artifact and compute digest
        run: |
          set -euo pipefail
          name="ao-host-linux-arm64.tar.gz"
          mkdir -p dist-artifact
          cp "dist-host/$name" "dist-artifact/$name"
          hash="$(openssl dgst -sha256 "dist-artifact/$name" | awk '{print $NF}')"
          jq -n --arg f "$name" --arg h "$hash" '{($f): $h}' > dist-artifact/linux-arm64-host.digest.json
          echo "linux-arm64-host: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-host
          path: frontend/dist-artifact/ao-host-linux-arm64.tar.gz
          # A week for PR builds, so someone can try one on an arm64 machine.
          retention-days: ${{ inputs.version != '' && 1 || 7 }}
          if-no-files-found: error
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # build-artifacts.yml's digests job merges every digest-* artifact.
          name: digest-linux-arm64-host
          path: frontend/dist-artifact/linux-arm64-host.digest.json
          retention-days: 1
          if-no-files-found: error
